<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>GeoGebraForQuest</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, sans-serif;
    }

    #ggb-element {
      position: absolute;
      inset: 0;
      background: #ffffff;
    }

    #boot-panel {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2147483646;
      max-width: 72%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ffffff;
      color: #202124;
      border: 1px solid #d9dce1;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
    }

    #boot-title {
      font-weight: 700;
      margin-bottom: 3px;
    }

    #status {
      color: #4a4d52;
    }
  </style>
</head>
<body>
  <div id="ggb-element"></div>

  <div id="boot-panel">
    <div id="boot-title">GeoGebraForQuest v0.9.0</div>
    <div id="status">Yerel stereo GeoGebra hazırlanıyor…</div>
  </div>

<script>
(function () {
  'use strict';

  const APPASSETS = 'https://appassets.androidplatform.net/assets/web/';
  const LOCAL_DEPLOY = APPASSETS + 'GeoGebra/deployggb.js';
  const LOCAL_CODEBASE = APPASSETS + 'GeoGebra/HTML5/5.0/web3d/';

  const bootPanel = document.getElementById('boot-panel');
  const status = document.getElementById('status');

  let ggb = null;
  let appletReady = false;
  let autoSaveTimer = null;

  function log(...args) {
    console.log('[GeoGebraForQuest]', ...args);
  }

  function setStatus(message) {
    status.textContent = message;
    log(message);
  }

  function showError(message) {
    bootPanel.style.display = 'block';
    bootPanel.style.borderColor = '#d93025';
    status.style.color = '#b3261e';
    setStatus(message);
  }

  function bridgeCall(name, ...args) {
    try {
      if (window.QuestBridge && typeof window.QuestBridge[name] === 'function') {
        window.QuestBridge[name](...args);
      }
    } catch (error) {
      console.error('[GeoGebraForQuest bridge]', name, error);
    }
  }

  function saveBase64(callback) {
    if (!ggb || typeof ggb.getBase64 !== 'function') {
      callback('');
      return;
    }
    try {
      ggb.getBase64(function (base64) {
        callback(base64 || '');
      });
    } catch (_) {
      callback('');
    }
  }

  window.GeoGebraForQuest = {
    importBase64(base64) {
      if (!base64) return;
      const tryLoad = function () {
        if (ggb && appletReady && typeof ggb.setBase64 === 'function') {
          try {
            ggb.setBase64(base64);
          } catch (error) {
            console.error(error);
          }
        } else {
          setTimeout(tryLoad, 200);
        }
      };
      tryLoad();
    }
  };

  function appletLoaded(api) {
    ggb = api || window.ggbApplet;
    window.ggbApplet = ggb;
    appletReady = true;

    bootPanel.style.borderColor = '#b8d8be';
    status.style.color = '#196b2c';
    setStatus('GeoGebra hazır · tam renkli SBS 3D');
    bridgeCall('panelReady');

    if (!autoSaveTimer) {
      autoSaveTimer = setInterval(function () {
        saveBase64(function (base64) {
          if (base64) bridgeCall('saveConstruction', base64);
        });
      }, 1200);
    }

    setTimeout(function () {
      if (appletReady) bootPanel.style.display = 'none';
    }, 1500);
  }

  function startApplet() {
    try {
      if (typeof GGBApplet !== 'function') {
        throw new Error('GGBApplet bulunamadı');
      }

      const params = {
        appName: 'classic',
        width: 1080,
        height: 720,
        showToolBar: true,
        showMenuBar: true,
        showAlgebraInput: true,
        showResetIcon: true,
        enableFileFeatures: true,
        enableRightClick: true,
        enableShiftDragZoom: true,
        enableLabelDrags: true,
        errorDialogsActive: true,
        useBrowserForJS: false,
        appletOnLoad: appletLoaded
      };

      const applet = new GGBApplet(params, true);
      applet.setHTML5Codebase(LOCAL_CODEBASE);
      applet.inject('ggb-element');

      setTimeout(function () {
        if (!appletReady) {
          showError('Yerel GeoGebraForQuest kaynak paketi başlatılamadı.');
        }
      }, 20000);
    } catch (error) {
      console.error(error);
      showError('GeoGebra başlatma hatası: ' + error.message);
    }
  }

  function injectGeoGebra() {
    setStatus('Yerel GeoGebraForQuest betiği yükleniyor…');
    const script = document.createElement('script');
    script.src = LOCAL_DEPLOY;
    script.onload = function () {
      setStatus('Tam renkli stereo GeoGebra başlatılıyor…');
      startApplet();
    };
    script.onerror = function () {
      showError('Yerel GeoGebraForQuest betiği yüklenemedi.');
    };
    document.head.appendChild(script);
  }

  injectGeoGebra();
})();
</script>
</body>
</html>
