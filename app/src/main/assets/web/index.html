<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>GeoGebraForQuest</title>
  <style>
    html, body, #ggb-element {
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:transparent;
    }

    body {
      font-family:system-ui, sans-serif;
    }

    #status {
      position:fixed;
      left:10px;
      bottom:8px;
      z-index:999999;
      padding:5px 8px;
      border-radius:8px;
      background:rgba(0,0,0,.62);
      color:white;
      font-size:12px;
      pointer-events:none;
    }

    #headset {
      position:fixed;
      z-index:999999;
      right:72px;
      top:70px;
      width:46px;
      height:38px;
      border:1px solid #aeb3bd;
      border-radius:8px;
      background:#f2f3f5;
      font-size:23px;
      cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.15);
    }

    #back2d {
      display:none;
      position:fixed;
      z-index:999999;
      right:14px;
      top:70px;
      height:38px;
      border:1px solid #aeb3bd;
      border-radius:8px;
      background:#f2f3f5;
      padding:0 10px;
      cursor:pointer;
    }

    body.spatial #back2d {
      display:block;
    }

    body.portal-on canvas.ggb-portal-canvas {
      opacity:0 !important;
    }
  </style>
</head>
<body>
  <div id="ggb-element"></div>
  <button id="headset" title="Spatial 3D">🥽</button>
  <button id="back2d">2D</button>
  <div id="status">GeoGebra yükleniyor…</div>

<script>
(function () {
  const status = document.getElementById('status');
  const headset = document.getElementById('headset');
  const back2d = document.getElementById('back2d');

  let spatialMode = false;
  let portalEnabled = false;
  let appletReady = false;

  function setStatus(message) {
    status.textContent = message;
    console.log('[GeoGebraForQuest]', message);
  }

  function markGraphicsCanvasForPortal() {
    const canvases = [...document.querySelectorAll('#ggb-element canvas')]
      .filter(canvas => canvas.width > 300 && canvas.height > 250);

    if (!canvases.length) {
      return false;
    }

    canvases.sort((a, b) => (b.width * b.height) - (a.width * a.height));
    const canvas = canvases[0];
    canvas.classList.add('ggb-portal-canvas');

    let parent = canvas.parentElement;
    for (let i = 0; parent && i < 4; i++, parent = parent.parentElement) {
      parent.style.background = 'transparent';
    }

    return true;
  }

  function setPortal(enabled) {
    portalEnabled = !!enabled;
    document.body.classList.toggle('portal-on', portalEnabled && spatialMode);

    if (portalEnabled && spatialMode) {
      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        if (markGraphicsCanvasForPortal() || tries > 20) {
          clearInterval(timer);
        }
      }, 150);
    }

    if (window.QuestBridge && QuestBridge.setPortalEnabled) {
      QuestBridge.setPortalEnabled(portalEnabled);
    }

    headset.style.background = portalEnabled ? '#dfe5ff' : '#f2f3f5';
  }

  function saveBase64(callback) {
    if (!window.ggbApplet || !ggbApplet.getBase64) {
      callback('');
      return;
    }

    try {
      ggbApplet.getBase64(function (base64) {
        callback(base64 || '');
      });
    } catch (error) {
      console.error(error);
      callback('');
    }
  }

  window.GeoGebraForQuest = {
    setSpatialMode(enabled) {
      spatialMode = !!enabled;
      document.body.classList.toggle('spatial', spatialMode);

      if (spatialMode) {
        setPortal(true);
      }
    },

    importBase64(base64) {
      if (!base64) {
        return;
      }

      const tryLoad = () => {
        if (window.ggbApplet && ggbApplet.setBase64 && appletReady) {
          try {
            ggbApplet.setBase64(base64);
            setStatus('Yerel çalışma yüklendi');
          } catch (error) {
            console.error(error);
          }
        } else {
          setTimeout(tryLoad, 250);
        }
      };

      tryLoad();
    },

    exportState(callback) {
      saveBase64(callback);
    }
  };

  headset.addEventListener('click', function () {
    if (!spatialMode) {
      setStatus('VR görünümü açılıyor…');
      saveBase64(function (base64) {
        if (window.QuestBridge && QuestBridge.enterSpatial) {
          QuestBridge.enterSpatial(base64);
        }
      });
    } else {
      setPortal(!portalEnabled);
    }
  });

  back2d.addEventListener('click', function () {
    saveBase64(function (base64) {
      if (window.QuestBridge && QuestBridge.returnToPanel) {
        QuestBridge.returnToPanel(base64);
      }
    });
  });

  function startApplet(local) {
    try {
      const params = {
        appName: 'classic',
        width: 1080,
        height: 720,
        showToolBar: true,
        showMenuBar: true,
        showAlgebraInput: true,
        showResetIcon: true,
        enableFileFeatures: true,
        enableRightClick: true,
        errorDialogsActive: true,
        useBrowserForJS: false,
        appletOnLoad: function () {
          appletReady = true;
          setStatus(local ? 'GeoGebra hazır · yerel' : 'GeoGebra hazır · çevrimiçi yedek');
        }
      };

      const applet = new GGBApplet(params, true);

      if (local) {
        // Current GeoGebra Math Apps Bundle places web3d here.
        applet.setHTML5Codebase('GeoGebra/HTML5/5.0/web3d/');
      }

      applet.inject('ggb-element');

      setTimeout(function () {
        if (!appletReady) {
          setStatus(local
            ? 'Yerel GeoGebra başlatılamadı'
            : 'GeoGebra başlatılamadı');
        }
      }, 12000);
    } catch (error) {
      console.error(error);
      setStatus('GeoGebra başlatma hatası');
    }
  }

  function injectGeoGebra(deployUrl, local) {
    const script = document.createElement('script');
    script.src = deployUrl;

    script.onload = function () {
      setStatus(local ? 'Yerel GeoGebra hazırlanıyor…' : 'GeoGebra CDN hazırlanıyor…');
      startApplet(local);
    };

    script.onerror = function () {
      if (local) {
        setStatus('Yerel paket açılamadı; CDN deneniyor…');
        injectGeoGebra('https://www.geogebra.org/apps/deployggb.js', false);
      } else {
        setStatus('GeoGebra yüklenemedi');
      }
    };

    document.head.appendChild(script);
  }

  injectGeoGebra('GeoGebra/deployggb.js', true);
})();
</script>
</body>
</html>
