<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>GeoGebraForQuest</title>
  <style>
    html, body {
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#ffffff;
      font-family:system-ui, sans-serif;
    }

    #ggb-element {
      position:absolute;
      inset:0;
      background:#ffffff;
    }

    #boot-panel {
      position:fixed;
      left:16px;
      top:16px;
      z-index:1000000;
      max-width:72%;
      padding:10px 12px;
      border-radius:10px;
      background:#ffffff;
      color:#202124;
      border:1px solid #d9dce1;
      box-shadow:0 2px 12px rgba(0,0,0,.12);
      font-size:13px;
      line-height:1.35;
      pointer-events:none;
    }

    #boot-title {
      font-weight:700;
      margin-bottom:3px;
    }

    #status {
      color:#4a4d52;
    }

    #headset {
      display:none;
      position:fixed;
      z-index:999999;
      right:24px;
      top:68px;
      width:48px;
      height:40px;
      border:1px solid #aeb3bd;
      border-radius:8px;
      background:#f2f3f5;
      font-size:23px;
      cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.15);
    }

    #headset.ready {
      display:block;
    }

    #back2d {
      display:none;
      position:fixed;
      z-index:999999;
      right:82px;
      top:68px;
      height:40px;
      border:1px solid #aeb3bd;
      border-radius:8px;
      background:#f2f3f5;
      padding:0 11px;
      cursor:pointer;
    }

    body.spatial #back2d {
      display:block;
    }
  </style>
</head>
<body>
  <div id="ggb-element"></div>

  <div id="boot-panel">
    <div id="boot-title">GeoGebraForQuest v0.2.2</div>
    <div id="status">Yerel GeoGebra hazırlanıyor…</div>
  </div>

  <button id="back2d">2D</button>
  <button id="headset" title="Spatial 3D">🥽</button>

<script>
(function () {
  'use strict';

  const APPASSETS = 'https://appassets.androidplatform.net/assets/web/';
  const LOCAL_DEPLOY = APPASSETS + 'GeoGebra/deployggb.js';
  const LOCAL_CODEBASE = APPASSETS + 'GeoGebra/HTML5/5.0/web3d/';
  const CDN_DEPLOY = 'https://www.geogebra.org/apps/deployggb.js';

  const status = document.getElementById('status');
  const bootPanel = document.getElementById('boot-panel');
  const headset = document.getElementById('headset');
  const back2d = document.getElementById('back2d');

  let spatialMode = false;
  let appletReady = false;
  let startupFinished = false;
  const useCdn = new URLSearchParams(location.search).get('cdn') === '1';

  function setStatus(message) {
    status.textContent = message;
    console.log('[GeoGebraForQuest]', message);
  }

  function showError(message) {
    bootPanel.style.borderColor = '#d93025';
    status.style.color = '#b3261e';
    setStatus(message);
  }

  window.addEventListener('error', function (event) {
    if (appletReady) return;
    const detail = event.message || (event.target && event.target.src) || 'Bilinmeyen JavaScript hatası';
    showError('Başlatma hatası: ' + detail);
  }, true);

  function saveBase64(callback) {
    if (!window.ggbApplet || !ggbApplet.getBase64) {
      callback('');
      return;
    }

    try {
      ggbApplet.getBase64(function (base64) {
        callback(base64 || '');
      });
    } catch (error) {
      console.error(error);
      callback('');
    }
  }

  window.GeoGebraForQuest = {
    setSpatialMode(enabled) {
      spatialMode = !!enabled;
      document.body.classList.toggle('spatial', spatialMode);
    },

    importBase64(base64) {
      if (!base64) return;

      const tryLoad = function () {
        if (window.ggbApplet && ggbApplet.setBase64 && appletReady) {
          try {
            ggbApplet.setBase64(base64);
            setStatus('Kayıtlı çalışma yüklendi');
          } catch (error) {
            console.error(error);
          }
        } else {
          setTimeout(tryLoad, 250);
        }
      };

      tryLoad();
    },

    exportState(callback) {
      saveBase64(callback);
    }
  };

  headset.addEventListener('click', function () {
    if (!appletReady) return;

    if (!spatialMode) {
      setStatus('Spatial görünüm açılıyor…');
      saveBase64(function (base64) {
        if (window.QuestBridge && QuestBridge.enterSpatial) {
          QuestBridge.enterSpatial(base64);
        }
      });
    }
  });

  back2d.addEventListener('click', function () {
    saveBase64(function (base64) {
      if (window.QuestBridge && QuestBridge.returnToPanel) {
        QuestBridge.returnToPanel(base64);
      }
    });
  });

  function appletLoaded(sourceName) {
    appletReady = true;
    startupFinished = true;
    headset.classList.add('ready');
    bootPanel.style.borderColor = '#b8d8be';
    status.style.color = '#196b2c';
    setStatus('GeoGebra hazır · ' + sourceName);

    setTimeout(function () {
      if (appletReady) bootPanel.style.display = 'none';
    }, 2500);
  }

  function startApplet(local) {
    try {
      if (typeof GGBApplet !== 'function') {
        throw new Error('GGBApplet bulunamadı');
      }

      const params = {
        appName: 'classic',
        width: 1080,
        height: 720,
        showToolBar: true,
        showMenuBar: true,
        showAlgebraInput: true,
        showResetIcon: true,
        enableFileFeatures: true,
        enableRightClick: true,
        errorDialogsActive: true,
        useBrowserForJS: false,
        appletOnLoad: function () {
          appletLoaded(local ? 'yerel paket' : 'çevrimiçi yedek');
        }
      };

      const applet = new GGBApplet(params, true);

      if (local) {
        applet.setHTML5Codebase(LOCAL_CODEBASE);
      }

      applet.inject('ggb-element');

      setTimeout(function () {
        if (startupFinished) return;

        if (local) {
          setStatus('Yerel paket yanıt vermedi; çevrimiçi yedek deneniyor…');
          location.replace(location.pathname + '?cdn=1');
        } else {
          showError('GeoGebra başlatılamadı. Ağ bağlantısını kontrol edin.');
        }
      }, 15000);
    } catch (error) {
      console.error(error);
      if (local) {
        setStatus('Yerel başlatma hatası; çevrimiçi yedek deneniyor…');
        location.replace(location.pathname + '?cdn=1');
      } else {
        showError('GeoGebra başlatma hatası: ' + error.message);
      }
    }
  }

  function injectGeoGebra(deployUrl, local) {
    setStatus(local ? 'Yerel GeoGebra betiği yükleniyor…' : 'GeoGebra CDN betiği yükleniyor…');

    const script = document.createElement('script');
    script.src = deployUrl;

    script.onload = function () {
      setStatus(local ? 'Yerel GeoGebra başlatılıyor…' : 'Çevrimiçi GeoGebra başlatılıyor…');
      startApplet(local);
    };

    script.onerror = function () {
      if (local) {
        setStatus('Yerel paket açılamadı; çevrimiçi yedek deneniyor…');
        location.replace(location.pathname + '?cdn=1');
      } else {
        showError('GeoGebra betiği yüklenemedi.');
      }
    };

    document.head.appendChild(script);
  }

  injectGeoGebra(useCdn ? CDN_DEPLOY : LOCAL_DEPLOY, !useCdn);
})();
</script>
</body>
</html>
