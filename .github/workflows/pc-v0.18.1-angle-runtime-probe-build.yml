name: GeoGebraForQuest PC v0.18.1 ANGLE Runtime Probe

on:
  push:
    branches:
      - pc-v0.18.0-angle-eye-sequence-probe
    paths:
      - '.github/workflows/pc-v0.18.1-angle-runtime-probe-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows-runtime-probe:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ANGLE_PROBE_RUN_ID: '34727937755'
      ANGLE_PROBE_ARTIFACT: 'GeoGebraForQuest-PC-v0.18.0-angle-eye-sequence-probe'

    steps:
      - name: Checkout v0.18 probe branch
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download proven v0.18 ANGLE probe DLLs
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE '.angle-v018'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh run download $env:ANGLE_PROBE_RUN_ID --repo 'sinan-ipek/GeoGebraForQuest' --name $env:ANGLE_PROBE_ARTIFACT --dir $dest
          $egl = Join-Path $dest 'libEGL.dll'
          $gles = Join-Path $dest 'libGLESv2.dll'
          if (-not (Test-Path $egl)) { throw "Missing probed ANGLE DLL: $egl" }
          if (-not (Test-Path $gles)) { throw "Missing probed ANGLE DLL: $gles" }
          Get-FileHash $egl,$gles -Algorithm SHA256 | Format-Table -AutoSize

      - name: Download Exp46 assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.exp46' | Out-Null
          gh release download 'v0.9.30-exp46-hover-target-grip-focus' --repo 'sinan-ipek/GeoGebraForQuest' --pattern 'GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk' --dir '.exp46'
          $apk = Get-ChildItem '.exp46' -Filter '*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'Exp46 APK missing' }
          Copy-Item $apk.FullName '.exp46/exp46.zip' -Force
          Expand-Archive '.exp46/exp46.zip' '.exp46/unpacked' -Force
          $source = '.exp46/unpacked/assets/web'
          if (Test-Path 'app/src/main/assets/web') { Remove-Item 'app/src/main/assets/web' -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'app/src/main/assets' | Out-Null
          Copy-Item $source 'app/src/main/assets/web' -Recurse -Force

      - name: Prepare standalone Quest stereo splash artwork
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $left = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_left.webp'
          $right = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_right.webp'
          Invoke-WebRequest $left -OutFile 'pc-xr/stereo_splash_left.webp'
          Invoke-WebRequest $right -OutFile 'pc-xr/stereo_splash_right.webp'
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from PIL import Image
          for side in ('left','right'):
              src=f'pc-xr/stereo_splash_{side}.webp'
              dst=f'pc-xr/stereo_splash_{side}.png'
              with Image.open(src) as im:
                  im.convert('RGBA').save(dst, 'PNG')
          '@ | python -

      - name: Apply known-working v0.13.22 stack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v013.py
          python tools/patch-pc-v013-buildfix.py
          python tools/patch-pc-v0131.py
          python tools/patch-pc-v0132.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0133.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0134.py
          python tools/patch-pc-v0134-buildfix.py
          python tools/patch-pc-v0135.py
          python tools/patch-pc-v0135-buildfix.py
          python tools/patch-pc-v0136.py
          python tools/patch-pc-v0136-buildfix.py
          python tools/patch-pc-v0137.py
          python tools/patch-pc-v0137-buildfix.py
          python tools/patch-pc-v0138-prep.py
          python tools/patch-pc-v0138-prep2.py
          python tools/patch-pc-v0138.py
          python tools/patch-pc-v0138-buildfix.py
          python tools/patch-pc-v0139-direct.py
          python tools/patch-pc-v0139-buildfix.py
          python tools/patch-pc-v01310.py
          python tools/patch-pc-v01310-buildfix.py
          python tools/patch-pc-v01311.py
          python tools/patch-pc-v01311-extra.py
          python tools/patch-pc-v01311-postfix.py
          python tools/patch-pc-v01312-prep.py
          python tools/patch-pc-v01312-buildprep.py
          python tools/patch-pc-v01312.py
          python tools/patch-pc-v01313.py
          python tools/patch-pc-v01314.py
          python tools/patch-pc-v01315.py
          python tools/patch-pc-v01316.py
          python tools/patch-pc-v01317.py
          python tools/patch-pc-v01318-prep.py
          python tools/patch-pc-v01318.py
          python tools/patch-pc-v01318-buildfix.py
          python tools/patch-pc-v01319.py
          python tools/patch-pc-v01320.py
          python tools/patch-pc-v01321.py
          python tools/patch-pc-v01321-js-extra.py
          python tools/patch-pc-v01321-extra.py
          python tools/patch-pc-v01321-compilefix.py
          python tools/patch-pc-v01321-buildfix.py
          python tools/patch-pc-v01322.py
          python tools/patch-pc-v01322-compilefix.py

      - name: Import proven v0.13.24 raw transport layer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/6ec8b49d1a23f2eca3a2a3feba220a59589aa545/tools'
          Invoke-WebRequest "$base/patch-pc-v01324.py" -OutFile 'tools/patch-pc-v01324-imported.py'
          Invoke-WebRequest "$base/patch-pc-v01324-buildfix.py" -OutFile 'tools/patch-pc-v01324-buildfix-imported.py'
          python tools/patch-pc-v01324-imported.py
          python tools/patch-pc-v01324-buildfix-imported.py

      - name: Apply v0.13.27 single-panel compositor base
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01327.py
          python tools/patch-pc-v01327-buildfix.py
          python tools/patch-pc-v01327-xr-compilefix.py

      - name: Apply v0.13.28 true L R compositor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01328.py

      - name: Restore exact proven v0.13.22 L R runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/checkpoint-v0.13.22-working-stereo/pc/pc-stereo-layout.js'
          Invoke-WebRequest $url -OutFile 'pc/pc-stereo-layout.js'

      - name: Apply depth-proven v0.13.29 single-panel cross-connect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01329.py

      - name: Apply v0.13.31 exact raw to legacy BGRA transport
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01331.py

      - name: Apply v0.13.35 correct L R recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01335.py

      - name: Verify proven v0.13.35 architecture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-Content 'pc/pc-stereo-layout.js' -Raw
          $graphics = Get-Content 'pc/MainFormV11.Graphics.cs' -Raw
          $writer = Get-Content 'pc/StereoSharedFrameWriter.cs' -Raw
          $render = Get-Content 'pc-xr/v11-render.hpp' -Raw
          $xr = Get-Content 'pc-xr/main-v11.cpp' -Raw
          $project = Get-Content 'pc/GeoGebraForQuest.PC.csproj' -Raw
          $build = Get-Content 'pc/build.ps1' -Raw
          if (-not $runtime.Contains("type: 'stereoRawPair'")) { throw 'raw true L R IPC missing' }
          if (-not $runtime.Contains('leftCaptureContext.getImageData')) { throw 'LEFT eye raw source missing' }
          if (-not $runtime.Contains('rightCaptureContext.getImageData')) { throw 'RIGHT eye raw source missing' }
          if (-not $runtime.Contains('window.ggqRawStereoAck')) { throw 'raw ACK gate missing' }
          if (-not $writer.Contains('_view.Write(116, 1)')) { throw 'legacy BGRA format missing' }
          if (-not $render.Contains('pairFrame->pixelFormat == 1')) { throw 'XR legacy BGRA compositor missing' }
          if (-not $xr.Contains('sbsFrame_.pixelFormat == 1')) { throw 'XR correct pair gate missing' }
          if ($runtime.Contains('__ggqPcGpuNativeSbs')) { throw 'embedded SBS JS path must be absent' }
          if ($writer.Contains('_view.Write(116, 4)')) { throw 'embedded SBS writer must be absent' }
          if ($render.Contains('pairFrame->pixelFormat == 4')) { throw 'embedded SBS XR split must be absent' }
          if (-not $graphics.Contains('v0.13.35: D3D immediate-context state is global')) { throw 'PC full viewport guard missing' }
          if (-not $project.Contains('<Version>0.13.35</Version>')) { throw 'v0.13.35 version missing' }
          if (-not $build.Contains('v0.13.35-correct-lr')) { throw 'v0.13.35 package label missing' }

      - name: Build proven v0.13.35 Windows package
        shell: powershell
        run: .\pc\build.ps1

      - name: Inject probed exact ANGLE DLLs and relabel package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'dist/GeoGebraForQuest-PC-v0.13.35-correct-lr-win-x64'
          $destDir = Join-Path $env:GITHUB_WORKSPACE 'dist/GeoGebraForQuest-PC-v0.18.1-angle-runtime-probe-win-x64'
          if (-not (Test-Path $sourceDir)) { throw "Missing v0.13.35 output: $sourceDir" }
          if (Test-Path $destDir) { Remove-Item $destDir -Recurse -Force }
          Copy-Item $sourceDir $destDir -Recurse -Force

          $probeDir = Join-Path $env:GITHUB_WORKSPACE '.angle-v018'
          $eglSrc = Join-Path $probeDir 'libEGL.dll'
          $glesSrc = Join-Path $probeDir 'libGLESv2.dll'
          $eglDst = Join-Path $destDir 'libEGL.dll'
          $glesDst = Join-Path $destDir 'libGLESv2.dll'
          if (-not (Test-Path $eglDst)) { throw "Stock libEGL.dll not found at expected package root: $eglDst" }
          if (-not (Test-Path $glesDst)) { throw "Stock libGLESv2.dll not found at expected package root: $glesDst" }

          $stockDir = Join-Path $destDir '_stock-angle-backup'
          New-Item -ItemType Directory -Force -Path $stockDir | Out-Null
          Copy-Item $eglDst (Join-Path $stockDir 'libEGL.dll') -Force
          Copy-Item $glesDst (Join-Path $stockDir 'libGLESv2.dll') -Force
          Copy-Item $eglSrc $eglDst -Force
          Copy-Item $glesSrc $glesDst -Force

          $readme = @(
            'GeoGebraForQuest PC v0.18.1 ANGLE Runtime Probe',
            '',
            'Runtime behavior is the proven v0.13.35 correct L/R stereo path.',
            'Only libEGL.dll and libGLESv2.dll are replaced by the exact Chromium-133 ANGLE eye-sequence probe build.',
            'The ANGLE probe is passive: no pixel readback, framebuffer copy, DOM staging, or CEF paint interception is added.',
            '',
            'Run the app normally with Quest connected and display/move a GeoGebra 3D scene for roughly 15-20 seconds.',
            'Then exit GeoGebraForQuest PC completely.',
            '',
            'Expected probe log beside the executable:',
            'GeoGebraForQuestPC.ANGLE-Eye-Probe.log',
            '',
            'Probe log columns:',
            'sequence,tick_ms,pid,tid,context,event,value',
            '',
            'Events of interest:',
            'MASK_LEFT, MASK_RIGHT, MASK_ALL, CLEAR_DEPTH',
            '',
            'This build is a measurement probe, not the final direct-GPU stereo transport.'
          )
          $readme | Set-Content (Join-Path $destDir 'V0.18.1-ANGLE-RUNTIME-PROBE.txt') -Encoding UTF8

          $hashLines = @()
          foreach ($name in @('libEGL.dll','libGLESv2.dll')) {
            $path = Join-Path $destDir $name
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            $hashLines += "$hash  $name"
          }
          $hashLines | Set-Content (Join-Path $destDir 'ANGLE-PROBE-SHA256.txt') -Encoding ASCII

      - name: Verify v0.18.1 runtime probe package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist/GeoGebraForQuest-PC-v0.18.1-angle-runtime-probe-win-x64'
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) { throw 'Main EXE missing' }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) { throw 'XR EXE missing' }
          if (-not (Test-Path "$dir/libEGL.dll")) { throw 'Probed libEGL.dll missing' }
          if (-not (Test-Path "$dir/libGLESv2.dll")) { throw 'Probed libGLESv2.dll missing' }
          if (-not (Test-Path "$dir/_stock-angle-backup/libEGL.dll")) { throw 'Stock ANGLE backup missing' }
          if (-not (Test-Path "$dir/V0.18.1-ANGLE-RUNTIME-PROBE.txt")) { throw 'Probe instructions missing' }

          $expectedEgl = (Get-FileHash '.angle-v018/libEGL.dll' -Algorithm SHA256).Hash
          $expectedGles = (Get-FileHash '.angle-v018/libGLESv2.dll' -Algorithm SHA256).Hash
          $actualEgl = (Get-FileHash "$dir/libEGL.dll" -Algorithm SHA256).Hash
          $actualGles = (Get-FileHash "$dir/libGLESv2.dll" -Algorithm SHA256).Hash
          if ($actualEgl -ne $expectedEgl) { throw 'libEGL.dll injection hash mismatch' }
          if ($actualGles -ne $expectedGles) { throw 'libGLESv2.dll injection hash mismatch' }
          Write-Host "Injected libEGL SHA256: $actualEgl"
          Write-Host "Injected libGLESv2 SHA256: $actualGles"

      - name: Upload v0.18.1 full runtime probe package
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.18.1-angle-runtime-probe-win-x64
          path: dist/GeoGebraForQuest-PC-v0.18.1-angle-runtime-probe-win-x64/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
