name: GeoGebraForQuest PC v0.13.18 UI Overlay Splash

on:
  push:
    branches:
      - pc-v0.13.18-ui-overlay-splash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Exp46 assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" --repo "sinan-ipek/GeoGebraForQuest" --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" --dir ".exp46"
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw 'Exp46 APK missing' }
          Copy-Item $apk.FullName ".exp46/exp46.zip" -Force
          Expand-Archive ".exp46/exp46.zip" ".exp46/unpacked" -Force
          $source = ".exp46/unpacked/assets/web"
          if (Test-Path "app/src/main/assets/web") { Remove-Item "app/src/main/assets/web" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force

      - name: Prepare standalone Quest stereo splash artwork
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $left = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_left.webp'
          $right = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_right.webp'
          Invoke-WebRequest $left -OutFile 'pc-xr/stereo_splash_left.webp'
          Invoke-WebRequest $right -OutFile 'pc-xr/stereo_splash_right.webp'
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from PIL import Image
          for side in ('left','right'):
              src=f'pc-xr/stereo_splash_{side}.webp'
              dst=f'pc-xr/stereo_splash_{side}.png'
              with Image.open(src) as im:
                  im.convert('RGBA').save(dst, 'PNG')
          '@ | python -
          if (-not (Test-Path 'pc-xr/stereo_splash_left.png')) { throw 'left splash PNG missing' }
          if (-not (Test-Path 'pc-xr/stereo_splash_right.png')) { throw 'right splash PNG missing' }

      - name: Apply patches
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v013.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v013-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0131.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0132.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0133-adapter.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0133.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0133-adapter.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0134.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0134-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0135.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0135-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0136.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0136-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0137.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0137-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0138-prep.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0138-prep2.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0138.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0138-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0139-direct.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v0139-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01310.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01310-buildfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01311.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01311-extra.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01311-postfix.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01312-prep.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01312-buildprep.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01312.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01313.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01314.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01315.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01316.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01317.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01318-prep.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/patch-pc-v01318.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify v0.13.18 UI overlay, Windows cursor and XR splash
        shell: powershell
        run: |
          $main = Get-Content 'pc/MainFormV11.cs' -Raw
          $input = Get-Content 'pc/MainFormV11.InputStereo.cs' -Raw
          $runtime = Get-Content 'pc/pc-stereo-layout.js' -Raw
          $writer = Get-Content 'pc/StereoSharedFrameWriter.cs' -Raw
          $shared = Get-Content 'pc-xr/v11-shared.hpp' -Raw
          $xr = Get-Content 'pc-xr/main-v11.cpp' -Raw
          $render = Get-Content 'pc-xr/v11-render.hpp' -Raw
          $cmake = Get-Content 'pc-xr/CMakeLists.txt' -Raw
          $project = Get-Content 'pc/GeoGebraForQuest.PC.csproj' -Raw
          if (-not $main.Contains('_stereoUiOverlayBounds')) { throw 'C# UI overlay state missing' }
          if (-not $input.Contains('WriteFrames(left, right, rect, size, overlays, frame)')) { throw 'overlay rectangles not carried to SBS writer' }
          if (-not $runtime.Contains('collectUiOverlayRects')) { throw 'dynamic UI overlay detector missing' }
          if (-not $runtime.Contains('uiOverlays: uiOverlays')) { throw 'UI overlays not present in layout payload' }
          if ($runtime.Contains("reportInactive('ui-overlay')")) { throw 'old menu-disables-B behavior still active' }
          if (-not $writer.Contains('MaxUiOverlayRects = 3')) { throw 'SBS overlay header writer missing' }
          if (-not $writer.Contains('_view.Write(64, overlayCount)')) { throw 'SBS overlay count write missing' }
          if (-not $shared.Contains('struct UiOverlayRectPx')) { throw 'C++ overlay header reader missing' }
          if (-not $xr.Contains('MakeUiOverlayRects')) { throw 'XR overlay rect conversion missing' }
          if (-not $xr.Contains('splashStarted_')) { throw 'visibility-scoped splash state missing' }
          if (-not $xr.Contains('CoInitializeEx')) { throw 'WIC COM initialization missing' }
          if (-not $xr.Contains('XR splash started on first visible/renderable frame')) { throw 'late splash start marker missing' }
          if (-not $render.Contains('DrawBaseOverlayPatches')) { throw 'A-over-B UI patch renderer missing' }
          if (-not $render.Contains('LoadCursorW(nullptr, IDC_ARROW)')) { throw 'Windows system arrow cursor missing' }
          if (-not $render.Contains('cursorHotspotU_')) { throw 'Windows cursor hotspot state missing' }
          if (-not $cmake.Contains('gdi32')) { throw 'GDI32 link missing' }
          if (-not $project.Contains('<Version>0.13.18</Version>')) { throw 'v0.13.18 version missing' }

      - name: Build Windows EXE package
        shell: powershell
        run: .\pc\build.ps1

      - name: Verify package
        shell: powershell
        run: |
          $dir = 'dist/GeoGebraForQuest-PC-v0.13.18-ui-overlay-splash-win-x64'
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) { throw 'Main EXE missing' }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) { throw 'XR EXE missing' }
          if (-not (Test-Path "$dir/xr/stereo_splash_left.png")) { throw 'left splash package missing' }
          if (-not (Test-Path "$dir/xr/stereo_splash_right.png")) { throw 'right splash package missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.13.18-ui-overlay-splash-win-x64
          path: dist/GeoGebraForQuest-PC-v0.13.18-ui-overlay-splash-win-x64/**
          if-no-files-found: error
          compression-level: 6
