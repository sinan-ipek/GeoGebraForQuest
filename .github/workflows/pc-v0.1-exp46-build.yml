name: GeoGebraForQuest PC v0.1 Exp46

on:
  push:
    branches:
      - pc-v0.1-exp46-base
    paths:
      - "pc/**"
      - "pc-xr/**"
      - ".github/workflows/pc-v0.1-exp46-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact published Quest Exp46 APK
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" `
            --repo "sinan-ipek/GeoGebraForQuest" `
            --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" `
            --dir ".exp46"

          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw "Published Exp46 APK could not be downloaded." }
          Write-Host "[GGQ-PC] Quest Exp46 APK: $($apk.FullName)"

      - name: Extract exact Exp46 web assets from APK
        shell: powershell
        run: |
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          $zip = ".exp46/exp46.zip"
          $extract = ".exp46/unpacked"
          Copy-Item $apk.FullName $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $source = Join-Path $extract "assets/web"
          if (-not (Test-Path "$source/GeoGebra/web3d/web3d.nocache.js")) {
            throw "Published Exp46 APK does not contain expected Web3D assets."
          }
          if (-not (Test-Path "$source/GeoGebra/GGQ_SOURCE_BUILD.txt")) {
            throw "Published Exp46 APK source metadata missing."
          }

          if (Test-Path "app/src/main/assets/web") {
            Remove-Item "app/src/main/assets/web" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force

          $meta = Get-Content "app/src/main/assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt" -Raw
          if ($meta -notmatch "renderer=QuestStereoRenderer") { throw "Unexpected renderer metadata." }
          if ($meta -notmatch "projection_calibration=exp45") { throw "Exp45/46 projection calibration missing." }
          if ($meta -notmatch "bridge=serial-gated JPEG pair delivery") { throw "Exp46 stereo bridge metadata missing." }
          Write-Host $meta

      - name: Build Windows app and OpenXR companion
        shell: powershell
        run: .\pc\build.ps1

      - name: Verify package
        shell: powershell
        run: |
          $dir = "dist/GeoGebraForQuest-PC-v0.1.0-exp46-win-x64"
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) { throw "Main EXE missing" }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) { throw "XR EXE missing" }
          if (-not (Test-Path "$dir/assets/web/GeoGebra/web3d/web3d.nocache.js")) { throw "Web3D missing" }
          if (-not (Test-Path "$dir/assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt")) { throw "Exp46 source metadata missing" }
          if (-not (Test-Path "dist/GeoGebraForQuest-PC-v0.1.0-exp46-win-x64.zip")) { throw "ZIP missing" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.1.0-exp46-win-x64
          path: dist/GeoGebraForQuest-PC-v0.1.0-exp46-win-x64.zip
          if-no-files-found: error

      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pc-v0.1.0-exp46"
          $zip = "dist/GeoGebraForQuest-PC-v0.1.0-exp46-win-x64.zip"
          $notes = @"
          First GeoGebraForQuest PC prototype. Its local GeoGebra/Web3D assets are extracted directly from the published Quest Exp46 APK, so the stereo renderer build is identical to the tested Exp46 package.

          - Windows WebView2 GeoGebra UI with physical mouse/keyboard input
          - Local .ggb open/save wrapper plus persistent WebView2 online/login profile
          - PC Stereo Panel B is mono by default; optional SBS diagnostic preview
          - OpenXR/D3D11 companion presents the same Windows client area as a large quad
          - B is eye-specific in Quest: left texture only to left eye, right texture only to right eye
          - Same OpenXR application path for Meta Quest Link cable and Air Link
          - v0.1 limitation: visible-window GDI capture; keep the app visible/unobscured during headset testing
          - Device testing is still required for Link/Air Link, eye order, placement, scale, latency, login and file workflows
          "@

          if (gh release view $tag --repo "sinan-ipek/GeoGebraForQuest" 2>$null) {
            gh release upload $tag $zip --repo "sinan-ipek/GeoGebraForQuest" --clobber
            gh release edit $tag --repo "sinan-ipek/GeoGebraForQuest" --notes $notes
          } else {
            gh release create $tag $zip `
              --repo "sinan-ipek/GeoGebraForQuest" `
              --title "GeoGebraForQuest PC v0.1.0 Exp46" `
              --notes $notes `
              --prerelease
          }
