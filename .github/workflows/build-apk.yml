name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Apply exp19 through exp25 lifecycle fixes
        shell: bash
        run: |
          python3 tools/patch-quest-stereo-js-exp19.py app/src/main/assets/web/quest-stereo-layout.js
          python3 tools/patch-android-exp19.py .
          python3 tools/patch-android-exp19-volatile.py .
          python3 tools/patch-android-exp19-querycompat.py .
          python3 tools/patch-android-exp20.py .
          python3 tools/patch-android-exp21.py .
          python3 tools/patch-android-exp22.py .
          python3 tools/patch-android-exp22-preserve-navigation.py .
          python3 tools/patch-android-exp23.py .
          python3 tools/patch-android-exp24.py .
          python3 tools/patch-android-exp25.py .

      - name: Verify exp25 hypotheses and frozen working paths
        shell: bash
        run: |
          set -x
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          LOGIN="$SRC/source/web/web/src/main/java/org/geogebra/web/shared/ggtapi/LoginOperationW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          PICKER=app/src/main/java/com/sinan/geogebraforquest/SpatialFilePickerPanelActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          EMBED=app/src/main/java/com/sinan/geogebraforquest/EmbeddedStereoTestSystem.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          IDS=app/src/main/res/values/ids.xml
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          if grep -q 'adaptiveStereoDelay' "$JS"; then exit 1; fi
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then exit 1; fi

          grep -q 'EXP19_NATIVE_LAYOUT_REARM' "$ACTIVITY"
          grep -q 'EXP20_CANONICAL_MAIN_GUARD' "$PANEL"
          grep -q 'EXP20_REMOTE_ESCAPE_FALLBACK' "$PANEL"
          grep -q 'EXP17_OPENFROMGGT_HANDOFF' "$PANEL"
          grep -q 'fun deliverOpenFromGgt(url: String)' "$PANEL"
          grep -q "window.ggbApplet.openFile(url" "$PANEL"

          grep -q 'GGQ_EXP22_LOGIN_READY_ACK' "$LOGIN"
          grep -q '__ggqLoginReady' "$LOGIN"
          grep -q '__ggqLoginSuccessToken' "$LOGIN"
          grep -q 'EXP22_LOGIN_READY_SUCCESS_HANDSHAKE' "$PANEL"
          grep -q 'EXP22_LOGIN_SUCCESS_ACK_BRIDGE' "$PANEL"

          grep -q 'EXP25_STRICT_POPUP_WHITELIST' "$PANEL"
          grep -q 'host == "accounts.geogebra.org"' "$PANEL"
          grep -q 'isTrustedGeoGebraCallback(uri)' "$PANEL"
          grep -q 'GeoGebraWebNavigation.deliverOpenFromGgt(uri.toString())' "$PANEL"
          grep -q 'closeForbiddenGeoGebraPopup(view, uri)' "$PANEL"

          grep -q 'EXP24_SPATIAL_PICKER_RESULT' "$PANEL"
          grep -q 'deliverSpatialPickerResult' "$PANEL"
          grep -q 'EXP24_SPATIAL_ACTIVITY_PICKER' "$PANEL"
          grep -q 'requestSpatialFilePickerPanel()' "$PANEL"

          grep -q 'EXP24_SPATIAL_FILE_PICKER_PANEL' "$ACTIVITY"
          grep -q 'ActivityPanelRegistration' "$ACTIVITY"
          grep -q 'R.id.local_file_picker_panel' "$ACTIVITY"
          grep -q 'processSpatialFilePickerPanelRequests' "$ACTIVITY"
          grep -q 'onSpatialFilePickerPanelResult' "$ACTIVITY"
          grep -q 'processSpatialFilePickerPanelRequests()' "$EMBED"

          grep -q 'class SpatialFilePickerPanelActivity : Activity()' "$PICKER"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PICKER"
          grep -q 'SpatialActivityManager.executeOnVrActivity<SpatialGeoGebraActivity>' "$PICKER"
          grep -q 'activity.onSpatialFilePickerPanelResult(uri)' "$PICKER"
          if grep -q 'executeOnAppSystemActivity' "$PICKER"; then
            echo 'old ActivityPanel bridge must not remain'
            exit 1
          fi

          grep -q 'SpatialFilePickerPanelActivity' "$MANIFEST"
          grep -q 'android:allowEmbedded="true"' "$MANIFEST"
          grep -q 'com.oculus.vrdesktop.fbpermission.CREATE_ACTIVITY_CONTAINER' "$MANIFEST"
          grep -q 'android:theme="@style/PanelAppThemeTransparent"' "$MANIFEST"
          grep -q 'local_file_picker_panel' "$IDS"

          for forbidden in \
            'requestLocalFilePickerLaunch(' \
            'processLocalFilePickerTopologyBoundary(' \
            'embeddedTopologySuspendedForPicker' \
            'requestEmbeddedTopologyRestoreAfterLocalFilePicker'; do
            if grep -q "$forbidden" "$ACTIVITY" "$EMBED"; then
              echo "stale Exp23 picker topology path: $forbidden"
              exit 1
            fi
          done

          if grep -q 'requestControllerPresentationRecovery(' "$ACTIVITY"; then
            echo 'failed Exp22 Avatar recovery must remain inactive'
            exit 1
          fi
          if grep -q 'controller.laserEnabled =' "$SHORTCUT"; then
            echo 'controller path must remain read-only'
            exit 1
          fi
          if grep -q 'entity.setComponent(controller)' "$SHORTCUT"; then
            echo 'must not rewrite Controller components'
            exit 1
          fi

          grep -q 'ButtonBits.ButtonSqueezeR' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonA' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonB' "$SHORTCUT"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify exp25 package
        shell: bash
        run: |
          grep -q 'versionName = "0.9.30-exp25-embedded-picker-popup-whitelist"' app/build.gradle.kts
          grep -q 'versionCode = 113' app/build.gradle.kts
          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'Open-in-app files load through local GgbAPIW ArchiveLoader'
          echo "$META" | grep 'canonical_runtime=exp20'
          echo "$META" | grep 'login_handshake=exp22'
          echo "$META" | grep 'local_picker=exp24'
          echo "$META" | grep 'popup_guard=exp25'
          echo "$META" | grep 'spatial_picker_container=exp25'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp25-embedded-picker-popup-whitelist-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp25-embedded-picker-popup-whitelist-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp25-embedded-picker-popup-whitelist-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp25-embedded-picker-popup-whitelist-debug.apk
          if-no-files-found: error
