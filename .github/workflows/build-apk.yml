name: Build Quest APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.15 controlled stereo A/B source
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          CONTROL=app/src/main/res/layout/scale_controls_panel.xml

          grep -q 'VideoSurfacePanelRegistration' "$ACTIVITY"
          grep -q 'StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'STEREO_PANEL_WIDTH_METERS = 0.80f' "$ACTIVITY"
          grep -q 'STEREO_PANEL_HEIGHT_METERS = 0.45f' "$ACTIVITY"
          grep -q 'STEREO_TEXTURE_WIDTH = 800' "$ACTIVITY"
          grep -q 'STEREO_TEXTURE_HEIGHT = 400' "$ACTIVITY"
          grep -q 'StereoSurfaceProbe.draw' "$ACTIVITY"
          grep -q 'switchToTestMode' "$ACTIVITY"
          grep -q 'switchToGeoGebraMode' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.setEnabled(false)' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.setEnabled(true)' "$ACTIVITY"
          grep -q 'Grabbable()' "$ACTIVITY"

          if grep -Eq 'GrabbableType|IsdkPanelResize|Scale\(' "$ACTIVITY"; then
            echo 'v0.9.15 diagnostic stereo activity must stay on the simple v0.9.11 entity path'
            exit 1
          fi

          grep -q 'stereo_test_mode' "$CONTROL"
          grep -q 'stereo_geogebra_mode' "$CONTROL"
          grep -q 'STEREO KAYNAĞI: TEST' "$CONTROL"

          grep -q 'fun setEnabled' "$SINK"
          grep -q 'Rect(0, 0, canvas.width, canvas.height)' "$SINK"
          grep -q 'canvas.drawBitmap(bitmap, source, destination, paint)' "$SINK"
          if grep -q 'fitCenter' "$SINK"; then
            echo 'fitCenter must not exist in the v0.9.15 controlled live frame path'
            exit 1
          fi

          grep -q 'updateStereoFrame' app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          grep -q 'LiveStereoFrameSink.submitDataUrl' app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          grep -q "toDataURL('image/jpeg'" app/src/main/assets/web/quest-stereo-layout.js
          grep -q 'preserveDrawingBuffer' tools/patch-geogebra-quest-v0913.py

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.15'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=always_2x_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'preserve_drawing_buffer=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'controlled A/B'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep '800x400 pixels, 0.80x0.45 metres'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web/GeoGebra/HTML5/5.0/web3d/web3d.nocache.js'; then
            echo 'Unexpected legacy HTML5/5.0 Web3D layout is still packaged'
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.15-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.15-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.15-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.15-debug-apk
          path: dist/GeoGebraForQuest-v0.9.15-debug.apk
          if-no-files-found: error
          retention-days: 30
