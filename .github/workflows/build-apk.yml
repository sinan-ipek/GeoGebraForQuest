name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Apply exp19 plus exp20 canonical runtime recovery
        shell: bash
        run: |
          python3 tools/patch-quest-stereo-js-exp19.py app/src/main/assets/web/quest-stereo-layout.js
          python3 tools/patch-android-exp19.py .
          python3 tools/patch-android-exp19-volatile.py .
          python3 tools/patch-android-exp19-querycompat.py .
          python3 tools/patch-android-exp20.py .

      - name: Verify exp20 hypothesis and frozen renderer path
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Frozen/proven stereo path.
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          grep -q 'pendingStereoSerial' "$JS"
          grep -q 'lastDeliveredStereoSerial' "$JS"
          if grep -q 'adaptiveStereoDelay' "$JS"; then
            echo 'Adaptive stereo backoff must not return'
            exit 1
          fi
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then
            echo 'Stereo sink must retain last frame'
            exit 1
          fi

          # Exp19 layout/login protection remains present.
          grep -q 'EXP19_FILE_LOAD_LAYOUT_REARM' "$JS"
          grep -q 'EXP19_NATIVE_LAYOUT_REARM' "$ACTIVITY"
          grep -q 'lastAppliedEmbeddedLayout = null' "$ACTIVITY"
          grep -q 'EXP19_POPUP_SESSION_EDGE' "$PANEL"
          grep -q 'popupInitialSessionToken' "$PANEL"
          grep -q 'token == baseline' "$PANEL"
          grep -q 'EXP19_INPUT_RECOVERY_WINDOW' "$SHORTCUT"
          grep -q '@Volatile' "$SHORTCUT"
          if grep -q 'controllers.isNotEmpty()' "$SHORTCUT"; then
            echo 'Meta Spatial Query result must not use Kotlin Collection isNotEmpty()'
            exit 1
          fi

          # Exp20: MAIN is never replaced by remote GeoGebra site shell.
          grep -q 'EXP20_CANONICAL_MAIN_GUARD' "$PANEL"
          grep -q 'handleGeoGebraNavigation(view, request.url, registerAsMain)' "$PANEL"
          grep -q 'isRemoteGeoGebraUri(uri)' "$PANEL"
          grep -q 'EXP20_REMOTE_ESCAPE_FALLBACK' "$PANEL"
          grep -q 'GeoGebraWebNavigation.deliverOpenFromGgt(uri.toString())' "$PANEL"

          # Exp20: local DocumentsUI return creates a fresh XR runtime and reopens
          # the staged file inside the newly created local patched AppW.
          grep -q 'EXP20_PENDING_LOCAL_FILE' "$PANEL"
          grep -q 'EXP20_CANONICAL_FILE_RESTART' "$PANEL"
          grep -q 'activity.recreate()' "$PANEL"
          grep -q 'EXP20_OPEN_STAGED_LOCAL_FILE' "$PANEL"
          grep -q 'PENDING_LOCAL_GGB_URL' "$PANEL"
          grep -q 'PendingLocalFilePathHandler' "$PANEL"
          grep -q 'addPathHandler("/pending/", PendingLocalFilePathHandler())' "$PANEL"
          grep -q 'GeoGebraWebNavigation.openPendingLocalFileIfAny()' "$PANEL"
          grep -q 'GeoGebraLocalFilePicker.handleActivityResult(this, requestCode' "$ACTIVITY"

          # Existing login and cloud material handoff must stay local-AppW based.
          grep -q 'EXP15_LOCAL_LOGIN_TOKEN_BRIDGE' "$PANEL"
          grep -q 'EXP17_OPENFROMGGT_HANDOFF' "$PANEL"
          grep -q 'fun deliverLoginToken(token: String)' "$PANEL"
          grep -q 'fun deliverOpenFromGgt(url: String)' "$PANEL"
          grep -q "window.ggbApplet.openFile(url" "$PANEL"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify exp20 package
        shell: bash
        run: |
          grep -q 'versionName = "0.9.30-exp20-canonical-runtime-guard"' app/build.gradle.kts
          grep -q 'versionCode = 108' app/build.gradle.kts
          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'fixed 720px; no dynamic resolution'
          echo "$META" | grep 'Open-in-app files load through local GgbAPIW ArchiveLoader'
          echo "$META" | grep 'file_load_lifecycle=exp19'
          echo "$META" | grep 'canonical_runtime=exp20'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp20-canonical-runtime-guard-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp20-canonical-runtime-guard-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp20-canonical-runtime-guard-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp20-canonical-runtime-guard-debug.apk
          if-no-files-found: error
