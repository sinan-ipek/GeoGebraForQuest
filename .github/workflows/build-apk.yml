name: Build Quest APK

on:
  push:
    branches: [ main, v0.9.22-splash-20fps, v0.9.23-login-back-30fps, v0.9.24-login-back-clear-20fps, v0.9.25-local-file-picker, v0.9.26-palette-context-localfile, v0.9.27-palette-splash-context-fixes, v0.9.28-selected-menu-ray-pass, v0.9.29-a-toggle-palette-offset ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify renderer and selected-object context-menu hook
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"

          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.clearColorBuffer()' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"
          grep -q 'int backingWidth = (int) (w \* ratio);' "$WEB"
          grep -q 'return 0;' "$WEB"
          grep -q 'int sourceX = 0;' "$WEB"
          grep -q 'glContext.finish();' "$WEB"
          grep -q 'ggq-renderer-left-eye' "$WEB"
          grep -q 'ggq-renderer-right-eye' "$WEB"

          grep -q 'ggqOpenContextMenu' "$EUCLIDIAN"
          grep -q 'ggqCloseContextMenu' "$EUCLIDIAN"
          grep -q 'v0.9.28 selected-object menu' "$EUCLIDIAN"
          grep -q 'getAppSelectedGeos()' "$EUCLIDIAN"
          grep -q 'showPopupMenu(' "$EUCLIDIAN"
          grep -q 'selectedGeos, controller.getView(), controller.mouseLoc' "$EUCLIDIAN"
          grep -q 'getGuiManager().removePopup()' "$EUCLIDIAN"
          if grep -q 'controller.handleLongTouch(x, y)' "$EUCLIDIAN"; then
            echo 'A must not perform a new background hit-test'
            exit 1
          fi

          if grep -q 'backingWidth = (int) (w \* ratio) \* 2' "$WEB"; then
            echo 'Renderer must keep a single-eye-width WebGL backing store'
            exit 1
          fi
          if grep -q 'sourceX = eye == EYE_RIGHT ? eyeWidth : 0' "$WEB"; then
            echo 'Right eye must not be read from x=W'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.29 A-toggle and palette-offset fixes
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          CONTROLLERS=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PATCH28=tools/patch-geogebra-quest-v0928.py
          LEFT=app/src/main/res/drawable-nodpi/stereo_splash_left.webp
          RIGHT=app/src/main/res/drawable-nodpi/stereo_splash_right.webp

          # Preserved v0.9.28 behavior.
          grep -q 'Quaternion(0f, 45f, 0f)' "$ACTIVITY"
          grep -q 'CONTROLLER_PALETTE_SCALE = Vector3(0.30f, 0.30f, 0.30f)' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q 'tryRemoveComponent<Hittable>()' "$ACTIVITY"
          grep -q 'StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.attachSurface(surface, resources)' "$ACTIVITY"
          file "$LEFT" | grep -q 'Web/P image'
          file "$RIGHT" | grep -q 'Web/P image'
          test "$(git hash-object "$LEFT")" = '0ed1acfd3e15cf2868370dc949b015d21a2da1f6'
          test "$(git hash-object "$RIGHT")" = 'af4dca689d0e2774728eba349e1715a1a149bf01'

          # Palette moves 4 cm right/toward hand and 7 cm down: vertical adjustment > lateral.
          grep -q 'Vector3(-0.13f, 0.01f, 0.10f)' "$ACTIVITY"

          # A must be shortcut-only: normal GeoGebra panel click input accepts triggers, not ButtonA.
          grep -q 'input = PanelInputOptions(' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonTriggerL or ButtonBits.ButtonTriggerR' "$ACTIVITY"
          if sed -n '/input = PanelInputOptions(/,/),/p' "$ACTIVITY" | grep -q 'ButtonBits.ButtonA'; then
            echo 'ButtonA must not be forwarded as normal panel primary/left-click input'
            exit 1
          fi
          grep -q 'GeoGebraWebNavigation.toggleContextMenu()' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonA' "$CONTROLLERS"
          grep -q 'controller.changedButtons' "$CONTROLLERS"
          grep -q 'controller.buttonState' "$CONTROLLERS"

          # Selected-object toggle remains native and JS keeps explicit open/close state.
          grep -q 'getAppSelectedGeos' "$PATCH28"
          grep -q 'showPopupMenu' "$PATCH28"
          grep -q '__ggqContextMenuVisible = false' "$PANEL"
          grep -q 'if (window.__ggqContextMenuVisible)' "$PANEL"
          grep -q 'window.ggqCloseContextMenu' "$PANEL"
          grep -q 'window.__ggqContextMenuVisible = opened' "$PANEL"

          # Existing working architecture remains unchanged.
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PANEL"
          grep -q 'activity.startActivityForResult' "$PANEL"
          grep -q 'CAPTURE_INTERVAL_MS = 50' "$JS"
          grep -q 'findVisible3DCanvas' "$JS"
          grep -q "bridge('stereoInactive', '')" "$JS"
          grep -q 'fun clearForInactiveView()' "$SINK"
          grep -q 'PorterDuff.Mode.CLEAR' "$SINK"

          grep -q 'versionName = "0.9.29"' app/build.gradle.kts
          grep -q 'versionCode = 80' app/build.gradle.kts

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=single_eye_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'no_final_sbs_split=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'quest_context_menu_mode=selected_geoelements'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'stereo_splash_left.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'stereo_splash_right.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/html/ggtcallback.html'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.29-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.29-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.29-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.29-debug-apk
          path: dist/GeoGebraForQuest-v0.9.29-debug.apk
          if-no-files-found: error
          retention-days: 30
