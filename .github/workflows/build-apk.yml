name: Build Quest APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.14 live stereo and external scaling source
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          grep -q 'VideoSurfacePanelRegistration' "$ACTIVITY"
          grep -q 'StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'scale_controls_panel' "$ACTIVITY"
          grep -q 'adjustGeoGebraScale' "$ACTIVITY"
          grep -q 'adjustStereoScale' "$ACTIVITY"
          grep -q 'setComponent(Scale(Vector3' "$ACTIVITY"
          if grep -q 'IsdkPanelResize' "$ACTIVITY"; then
            echo 'IsdkPanelResize must not touch the v0.9.14 stereo presentation path'
            exit 1
          fi
          if grep -q 'twoHandGrab\|allowScaling\|minScale\|maxScale' "$ACTIVITY"; then
            echo 'Unsupported Grabbable scaling API leaked back into source'
            exit 1
          fi
          grep -q 'updateStereoFrame' app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          grep -q 'LiveStereoFrameSink.submitDataUrl' app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          grep -q "toDataURL('image/jpeg'" app/src/main/assets/web/quest-stereo-layout.js
          grep -q 'LiveStereoFrameSink' app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          grep -q 'lockCanvas' app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          grep -q 'preserveDrawingBuffer' tools/patch-geogebra-quest-v0913.py
          test -f app/src/main/res/layout/scale_controls_panel.xml

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.14'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=always_2x_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'preserve_drawing_buffer=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'external Scale controls'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web/GeoGebra/HTML5/5.0/web3d/web3d.nocache.js'; then
            echo 'Unexpected legacy HTML5/5.0 Web3D layout is still packaged'
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.14-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.14-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.14-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.14-debug-apk
          path: dist/GeoGebraForQuest-v0.9.14-debug.apk
          if-no-files-found: error
          retention-days: 30
