name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Apply Exp27 runtime plus Exp33 login semantics
        shell: bash
        run: |
          python3 tools/patch-quest-stereo-js-exp19.py app/src/main/assets/web/quest-stereo-layout.js
          python3 tools/patch-android-exp19.py .
          python3 tools/patch-android-exp19-volatile.py .
          python3 tools/patch-android-exp19-querycompat.py .
          python3 tools/patch-android-exp20.py .
          python3 tools/patch-android-exp21.py .
          python3 tools/patch-android-exp22.py .
          python3 tools/patch-android-exp22-preserve-navigation.py .
          python3 tools/patch-android-exp23.py .
          python3 tools/patch-android-exp24.py .
          python3 tools/patch-android-exp25.py .
          python3 tools/patch-android-exp26.py .
          python3 tools/patch-android-exp27.py .
          # Deliberately do not apply exp28, exp29, exp30 or exp31.
          python3 tools/patch-android-exp33c.py .

      - name: Verify Exp33 cookie auth and exact Exp27 XR runtime
        shell: bash
        run: |
          set -x
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          LOGIN="$SRC/source/web/web/src/main/java/org/geogebra/web/shared/ggtapi/LoginOperationW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          COLD=app/src/main/java/com/sinan/geogebraforquest/ColdLocalFilePickerActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Stereo/runtime invariants.
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          if grep -q 'adaptiveStereoDelay' "$JS"; then exit 1; fi
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then exit 1; fi

          # Bug1 navigation/popup protection must remain intact after Exp33.
          grep -q 'GGQ_EXP22_LOGIN_READY_ACK' "$LOGIN"
          grep -q 'EXP20_CANONICAL_MAIN_GUARD' "$PANEL"
          grep -q 'EXP20_REMOTE_ESCAPE_FALLBACK' "$PANEL"
          grep -q 'EXP22_LOGIN_READY_SUCCESS_HANDSHAKE' "$PANEL"
          grep -q 'EXP25_STRICT_POPUP_WHITELIST' "$PANEL"
          grep -q 'host == "accounts.geogebra.org"' "$PANEL"
          grep -q 'isTrustedGeoGebraCallback(uri)' "$PANEL"
          grep -q 'GeoGebraWebNavigation.deliverOpenFromGgt(uri.toString())' "$PANEL"

          # Source semantics: OAuth token and SSID cookie are distinct credentials.
          grep -q 'GGQ_EXP33_COOKIE_AUTH_SEMANTICS' "$LOGIN"
          grep -q '"logincookie".equals(action)' "$LOGIN"
          grep -q 'new GeoGebraTubeUser(null, ggqPendingLoginToken)' "$LOGIN"
          grep -q 'performTokenLogin(ggqPendingLoginToken, false)' "$LOGIN"

          # Android semantics: SSID uses cookie path only on a changed edge.
          grep -q 'EXP33_COOKIE_LOGIN_DELIVERY' "$PANEL"
          grep -q 'put("action", "logincookie")' "$PANEL"
          grep -q 'EXP33_POPUP_COOKIE_BASELINE' "$PANEL"
          grep -q 'snapshotPopupSessionBaseline(popup)' "$PANEL"
          grep -q 'EXP33_COOKIE_EDGE_ONLY' "$PANEL"
          grep -q 'changedPopupSessionCookie(view)' "$PANEL"
          grep -q 'GeoGebraWebNavigation.deliverLoginCookie(cookie)' "$PANEL"

          python3 - <<'PY'
          from pathlib import Path
          import re

          panel = Path('app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt').read_text()

          def one_function(signature):
              start = panel.index(signature)
              end = panel.find('\nprivate fun ', start + len(signature))
              assert end > start
              return panel[start:end]

          # Trusted callback is a real OAuth token and must stay on token auth.
          callback = one_function(
              'private fun handleGeoGebraLoginCallback(view: WebView, uri: Uri): Boolean {'
          )
          assert 'GeoGebraWebNavigation.deliverLoginToken(token)' in callback
          assert 'deliverLoginCookie' not in callback

          # The central SSID path must be edge-only cookie auth.
          cookie = one_function(
              'private fun completePopupLoginFromCookie(view: WebView, url: String): Boolean {'
          )
          assert 'changedPopupSessionCookie(view)' in cookie
          assert 'deliverLoginCookie(cookie)' in cookie
          assert 'deliverLoginToken(' not in cookie
          assert 'popupInitialSessionToken[view] = cookie' in cookie

          # Bug1's canonical MAIN guard must still have its real behavior, not just a marker.
          nav = one_function('private fun handleGeoGebraNavigation(')
          assert 'if (!registerAsMain)' in nav
          assert 'if (!isRemoteGeoGebraUri(uri)) return false' in nav
          assert 'GeoGebraWebNavigation.deliverOpenFromGgt(uri.toString())' in nav
          assert nav.rstrip().endswith('}')
          assert 'return true' in nav

          # No historical SSID-as-token block may survive, regardless of helper name.
          old = re.compile(
              r'val token = popupGeoGebraSessionToken\(view\).*?'
              r'deliverLoginToken\(token\)',
              re.S,
          )
          assert not old.search(panel), 'SSID cookie is still being forwarded as OAuth token'
          assert panel.count('GeoGebraWebNavigation.deliverLoginCookie(cookie)') >= 1
          PY

          # Exact Exp27 local-file/XR architecture remains unchanged.
          grep -q 'EXP27_COLD_PROCESS_PICKER' "$PANEL"
          grep -q 'ColdLocalFilePickerActivity::class.java' "$PANEL"
          grep -q 'EXP27_OPEN_COLD_PENDING_FILE' "$PANEL"
          grep -q 'openPendingColdLocalFileIfAny' "$PANEL"
          grep -q 'addPathHandler("/pending-cold/", ColdLocalFilePathHandler' "$PANEL"
          grep -q 'EXP27_COLD_PICKER_PROXY' "$COLD"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$COLD"
          grep -q 'KILL_MAIN_DELAY_MS = 300L' "$COLD"
          grep -q 'Process.killProcess(process.pid)' "$COLD"
          grep -q 'ColdLocalFileBridge.stage(applicationContext, uri)' "$COLD"
          grep -q 'Intent.FLAG_ACTIVITY_CLEAR_TASK' "$COLD"
          grep -q 'SpatialGeoGebraActivity::class.java' "$COLD"
          grep -q 'android:name=".ColdLocalFilePickerActivity"' "$MANIFEST"
          grep -q 'android:process=":localpicker"' "$MANIFEST"
          if grep -q 'requestSpatialFilePickerPanel()' "$PANEL"; then
            echo 'Exp33 MAIN still routes local files through ActivityPanel'
            exit 1
          fi

          # Post-Exp27 XR/session-restart experiments remain absent.
          for BAD in \
            EXP28_KEEP_MAIN_VISIBLE_WHILE_PICKING \
            EXP28_POST_RESULT_COLD_HANDOFF \
            EXP29_CONFIRMED_PROCESS_EXIT \
            EXP30_GRACEFUL_XR_SHUTDOWN \
            EXP30_COLD_SESSION_RESTORE \
            EXP31_CURRENT_REMOTE_SESSION \
            EXP31_SNAPSHOT_SESSION_BEFORE_COLD_PICKER \
            EXP31_RESTORE_COLD_SESSION_ONCE \
            XR_RELEASE_SETTLE_MS \
            requestGracefulSpatialShutdown \
            prepareSessionRestore \
            restoreColdSessionIfAny; do
            if grep -q "$BAD" "$PANEL" "$COLD" "$ACTIVITY"; then
              echo "Unexpected post-Exp27 runtime marker: $BAD"
              exit 1
            fi
          done

          # Failed controller-repair hypotheses remain inactive/read-only.
          if grep -q 'requestControllerPresentationRecovery(' "$ACTIVITY"; then
            echo 'failed Exp22 Avatar recovery must remain inactive'
            exit 1
          fi
          if grep -q 'controller.laserEnabled =' "$SHORTCUT"; then
            echo 'controller path must remain read-only'
            exit 1
          fi
          if grep -q 'entity.setComponent(controller)' "$SHORTCUT"; then
            echo 'must not rewrite Controller components'
            exit 1
          fi

          grep -q 'ButtonBits.ButtonSqueezeR' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonA' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonB' "$SHORTCUT"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Exp33 package
        shell: bash
        run: |
          grep -q 'versionName = "0.9.30-exp33-cookie-auth-semantics"' app/build.gradle.kts
          grep -q 'versionCode = 121' app/build.gradle.kts
          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'Open-in-app files load through local GgbAPIW ArchiveLoader'
          echo "$META" | grep 'canonical_runtime=exp20'
          echo "$META" | grep 'login_handshake=exp22'
          echo "$META" | grep 'popup_guard=exp25'
          echo "$META" | grep 'local_picker=exp27'
          echo "$META" | grep 'login_cookie_semantics=exp33'
          if echo "$META" | grep -q 'local_picker_ux=exp28'; then exit 1; fi
          if echo "$META" | grep -q 'local_picker_handoff=exp29'; then exit 1; fi
          if echo "$META" | grep -q 'local_picker_handoff=exp30'; then exit 1; fi
          if echo "$META" | grep -q 'session_continuity=exp31'; then exit 1; fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp33-cookie-auth-semantics-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp33-cookie-auth-semantics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp33-cookie-auth-semantics-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp33-cookie-auth-semantics-debug.apk
          if-no-files-found: error
