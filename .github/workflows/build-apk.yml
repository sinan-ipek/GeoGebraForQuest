name: Build Quest APK

on:
  push:
    branches: [ main, v0.9.22-splash-20fps, v0.9.23-login-back-30fps, v0.9.24-login-back-clear-20fps, v0.9.25-local-file-picker, v0.9.26-palette-context-localfile, v0.9.27-palette-splash-context-fixes, v0.9.28-selected-menu-ray-pass, v0.9.29-a-toggle-palette-offset, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify renderer and selected-object context-menu hook
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"

          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.clearColorBuffer()' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"
          grep -q 'int backingWidth = (int) (w \* ratio);' "$WEB"
          grep -q 'return 0;' "$WEB"
          grep -q 'int sourceX = 0;' "$WEB"
          grep -q 'glContext.finish();' "$WEB"
          grep -q 'ggq-renderer-left-eye' "$WEB"
          grep -q 'ggq-renderer-right-eye' "$WEB"

          grep -q 'ggqOpenContextMenu' "$EUCLIDIAN"
          grep -q 'ggqCloseContextMenu' "$EUCLIDIAN"
          grep -q 'getAppSelectedGeos()' "$EUCLIDIAN"
          grep -q 'showPopupMenu(' "$EUCLIDIAN"
          grep -q 'selectedGeos, controller.getView(), controller.mouseLoc' "$EUCLIDIAN"
          grep -q 'getGuiManager().removePopup()' "$EUCLIDIAN"
          if grep -q 'controller.handleLongTouch(x, y)' "$EUCLIDIAN"; then
            echo 'A must not perform a new background hit-test'
            exit 1
          fi

          if grep -q 'backingWidth = (int) (w \* ratio) \* 2' "$WEB"; then
            echo 'Renderer must keep a single-eye-width WebGL backing store'
            exit 1
          fi
          if grep -q 'sourceX = eye == EYE_RIGHT ? eyeWidth : 0' "$WEB"; then
            echo 'Right eye must not be read from x=W'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify embedded-stereo proof experiment
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SYSTEM=app/src/main/java/com/sinan/geogebraforquest/EmbeddedStereoTestSystem.kt
          CONTROLLERS=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js
          INDEX=app/src/main/assets/web/index.html
          TEST_LAYOUT=app/src/main/res/layout/spatial_embedded_stereo_test_panel.xml

          grep -q 'Quaternion(0f, 45f, 0f)' "$ACTIVITY"
          grep -q 'Vector3(-0.13f, 0.01f, 0.10f)' "$ACTIVITY"
          grep -q 'CONTROLLER_PALETTE_SCALE = Vector3(0.30f, 0.30f, 0.30f)' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonTriggerL or ButtonBits.ButtonTriggerR' "$ACTIVITY"
          grep -q 'GeoGebraWebNavigation.toggleContextMenu()' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonA' "$CONTROLLERS"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PANEL"
          grep -q 'CAPTURE_INTERVAL_MS = 50' "$JS"
          grep -q 'fun clearForInactiveView()' "$SINK"

          grep -q 'webView.setBackgroundColor(Color.TRANSPARENT)' "$ACTIVITY"
          grep -q "canvas.dataset.ggqStereoHole" "$JS"
          grep -q "setProperty('opacity', '0', 'important')" "$JS"
          grep -q "setProperty('pointer-events', 'auto', 'important')" "$JS"
          grep -q 'isStereoHole' "$JS"
          grep -q 'background: transparent' "$INDEX"

          test -e "$SYSTEM"
          test -e "$TEST_LAYOUT"
          grep -q 'EmbeddedStereoTestSystem(this)' "$ACTIVITY"
          grep -q 'TransformParent(geoPanel)' "$ACTIVITY"
          grep -q 'EMBEDDED_TEST_DEPTH_METERS = 0.003f' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q 'PANEL_WIDTH_METERS \* width / viewWidth' "$ACTIVITY"
          grep -q 'PANEL_HEIGHT_METERS \* height / viewHeight' "$ACTIVITY"
          grep -q 'active: true' "$JS"
          grep -q 'JSON.stringify({ active: false })' "$JS"
          grep -q 'EMBEDDED STEREO TEST' "$TEST_LAYOUT"

          grep -q 'versionName = "0.9.30-exp1"' app/build.gradle.kts
          grep -q 'versionCode = 81' app/build.gradle.kts

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=single_eye_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'no_final_sbs_split=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'quest_context_menu_mode=selected_geoelements'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'spatial_embedded_stereo_test_panel.xml'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/html/ggtcallback.html'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp1-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.30-exp1-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp1-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp1-debug.apk
          if-no-files-found: error
          retention-days: 30
