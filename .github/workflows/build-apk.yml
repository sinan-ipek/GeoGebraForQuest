name: Build Quest APK

on:
  push:
    branches: [ main, v0.9.22-splash-20fps, v0.9.23-login-back-30fps, v0.9.24-login-back-clear-20fps, v0.9.25-local-file-picker, v0.9.26-palette-context-localfile, v0.9.27-palette-splash-context-fixes, v0.9.28-selected-menu-ray-pass, v0.9.29-a-toggle-palette-offset, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify exp9 renderer and UI-priority patches
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          RENDERER="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/Renderer.java"
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Exp8 demand-driven renderer remains: ordinary repaints are RIGHT only.
          grep -q 'requestQuestStereoFrame()' "$RENDERER"
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          if grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"; then
            echo 'RIGHT eye must remain reused from the main WebGL canvas'
            exit 1
          fi
          grep -q 'name = "ggqRequestStereoFrame"' "$WEB"
          grep -q 'name = "ggqGetStereoFrameSerial"' "$WEB"

          # Exp9 A: current selection first, native pointer hit-test fallback second.
          grep -q 'v0.9.29 selected-first pointer fallback' "$EUCLIDIAN"
          grep -q 'getAppSelectedGeos()' "$EUCLIDIAN"
          grep -q 'showPopupMenu(' "$EUCLIDIAN"
          grep -q 'controller.handleLongTouch(x, y);' "$EUCLIDIAN"
          grep -q 'getGuiManager().removePopup()' "$EUCLIDIAN"

          # Exp9 browser scheduler: async JPEG, adaptive backoff, popup/UI priority.
          grep -q 'EXP9_UI_PRIORITY = true' "$JS"
          grep -q 'CAPTURE_ACTIVE_EYE_WIDTH = 540' "$JS"
          grep -q 'CAPTURE_IDLE_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_IDLE_DELAY_MS = 300' "$JS"
          grep -q 'canvas.toBlob' "$JS"
          grep -q 'new FileReader()' "$JS"
          grep -q 'adaptiveStereoDelay' "$JS"
          grep -q 'isVisibleGeoGebraPopup' "$JS"
          grep -q 'window.__ggqPrioritizeUi = prioritizeGeoGebraUi' "$JS"
          grep -q 'stereoEncodeInFlight' "$JS"
          if grep -q '\.toDataURL(' "$JS"; then
            echo 'Exp9 must not synchronously JPEG-encode with toDataURL'
            exit 1
          fi
          if grep -q 'now + 16' "$JS"; then
            echo 'Exp9 must not restore the old 16 ms slow-pair retry'
            exit 1
          fi

          # Actual popup state controls A toggling; A grants UI a stereo-free window.
          grep -q 'EXP9_ACTUAL_POPUP_STATE' "$PANEL"
          grep -q 'isVisibleContextPopup()' "$PANEL"
          grep -q '__ggqPrioritizeUi(700)' "$PANEL"

          # A slow stereo stream must retain its last good frame instead of blinking transparent.
          grep -q 'exp9 retains last live stereo frame' "$SINK"
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then
            echo 'Exp9 must not clear the stereo surface on a fixed idle timeout'
            exit 1
          fi
          if grep -q 'scheduleIdleClear' "$SINK"; then
            echo 'Exp9 must not retain the old idle-clear watchdog path'
            exit 1
          fi
          grep -q 'fun clearForInactiveView()' "$SINK"

          # Patch wiring must be explicit and reproducible.
          grep -q 'patch-quest-stereo-js-exp9.py' tools/build-geogebra-quest.sh
          grep -q 'patch-geogebra-quest-v0929.py' tools/build-geogebra-quest.sh
          grep -q 'patch-android-ui-exp9.py' tools/build-geogebra-quest.sh

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.30-exp9-ui-priority behavior
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          CONTROLLERS=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js
          BACKPLATE=app/src/main/res/layout/spatial_embedded_backplate_panel.xml

          # Stable interaction / panel behavior remains frozen.
          grep -q 'Vector3(-0.13f, 0.01f, 0.10f)' "$ACTIVITY"
          grep -q 'CONTROLLER_PALETTE_SCALE = Vector3(0.30f, 0.30f, 0.30f)' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonTriggerL or ButtonBits.ButtonTriggerR' "$ACTIVITY"
          grep -q 'GeoGebraWebNavigation.toggleContextMenu()' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonA' "$CONTROLLERS"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PANEL"

          # Exp6 geometry/compositor and exp5 full-half fill remain frozen.
          grep -q 'EMBEDDED_STEREO_DEPTH_METERS = 0.0f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_DEPTH_METERS = 0.10f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_SCALE = Vector3(1.07f, 1.07f, 1f)' "$ACTIVITY"
          grep -q 'stereoMode = StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'zIndex = 0' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q '#FFFFFFFF' "$BACKPLATE"
          grep -q 'val leftDestination = Rect(0, 0, halfWidth, canvas.height)' "$SINK"
          grep -q 'val rightDestination = Rect(halfWidth, 0, canvas.width, canvas.height)' "$SINK"
          if grep -q 'fitCenter' "$SINK"; then
            echo 'Black-band fitCenter behavior must not return'
            exit 1
          fi

          # Selective-hole anti-recursion stays intact.
          grep -q 'ggqStereoHole' "$JS"
          grep -q 'applySelectiveHole' "$JS"
          grep -q "attributeFilter: \['class', 'hidden', 'aria-hidden'\]" "$JS"
          if grep -q "attributeFilter: .*'style'" "$JS"; then
            echo 'Selective-hole code must not observe its own style writes'
            exit 1
          fi

          # One-shot startup splash stays intact.
          grep -q 'INITIAL_STEREO_POSE = Pose' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.resetForAppLaunch()' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.dismissStartupSplash()' "$ACTIVITY"
          grep -q 'fun resetForAppLaunch()' "$SINK"
          grep -q 'fun dismissStartupSplash()' "$SINK"

          grep -q 'versionName = "0.9.30-exp9-ui-priority"' app/build.gradle.kts
          grep -q 'versionCode = 98' app/build.gradle.kts

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l "$APK" | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l "$APK" | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p "$APK" assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.22'
          unzip -p "$APK" assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'renderer_normal_frame=RIGHT_EYE only'
          unzip -p "$APK" assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'bridge=serial-gated async JPEG pair delivery; active 540px, idle 720px, quality 0.78'
          unzip -p "$APK" assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'stereo_scheduler=adaptive backoff plus popup/UI-priority pause; last frame retained while paused'
          unzip -p "$APK" assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'quest_context_menu_mode=selected_geoelements_first_then_native_pointer_hit_fallback'
          unzip -l "$APK" | grep 'spatial_embedded_backplate_panel.xml'
          if unzip -l "$APK" | grep -q 'spatial_embedded_stereo_test_panel.xml'; then
            echo 'Obsolete proof-panel resource must not be packaged'
            exit 1
          fi
          unzip -l "$APK" | grep 'assets/web/GeoGebra/web3d/html/ggtcallback.html'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp9-ui-priority-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.30-exp9-ui-priority-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp9-ui-priority-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp9-ui-priority-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp9-ui-priority-debug.apk
          if-no-files-found: error
          retention-days: 30
