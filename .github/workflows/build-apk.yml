name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify exp13 renderer, right-click, depth ray and grip rotate
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          RENDERER="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/Renderer.java"
          VIEW3D="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/EuclidianView3D.java"
          GRIP3D="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/EuclidianController3DW.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Demand-driven renderer and fixed-quality capture remain frozen.
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          if grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"; then
            echo 'RIGHT renderer snapshot must remain removed'
            exit 1
          fi
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'name = "ggqRequestStereoFrame"' "$WEB"
          grep -q 'name = "ggqGetStereoFrameSerial"' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          grep -q 'pendingStereoSerial' "$JS"
          grep -q 'lastDeliveredStereoSerial' "$JS"
          for forbidden in \
            'CAPTURE_ACTIVE_EYE_WIDTH' \
            'CAPTURE_IDLE_EYE_WIDTH' \
            'CAPTURE_IDLE_DELAY_MS' \
            'lastStereoMotionAt' \
            'markStereoMotion' \
            'markPointerMotion' \
            'captureEyeWidth(' \
            '540'; do
            if grep -q "$forbidden" "$JS"; then
              echo "Dynamic capture residue must not exist in exp13: $forbidden"
              exit 1
            fi
          done
          if grep -q 'adaptiveStereoDelay' "$JS"; then
            echo 'Adaptive UI-priority backoff must not return'
            exit 1
          fi

          # Slow frame gaps retain B rather than blanking it.
          grep -q 'exp9 retains last live stereo frame' "$SINK"
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then
            echo '350ms idle clear must stay removed'
            exit 1
          fi

          # Working exp10 Quest A context menu remains unchanged.
          grep -q 'v0.9.30 Quest-pointer anchored context menu' "$EUCLIDIAN"
          grep -q 'controller.setMouseLocation(false, questX, questY);' "$EUCLIDIAN"
          grep -q 'setHits(controller.mouseLoc, PointerEventType.MOUSE)' "$EUCLIDIAN"
          grep -q 'setSelectedGeos(pointerSelection)' "$EUCLIDIAN"
          grep -q 'EXP10_STEREO_HOLE_CONTEXT_TARGET' "$PANEL"
          grep -q 'var nativeAvailable = typeof window.ggqOpenContextMenu' "$PANEL"

          # Exp13 ray: Meta beam stays visible to A, then a per-eye GeoGebra continuation runs
          # from the z=0 panel point to the existing depth-correct glasses cursor.
          grep -q 'EXP13_QUEST_MOUSE_RAY' "$RENDERER"
          grep -q 'questMouseRayIndex' "$RENDERER"
          grep -q 'setQuestMouseRayEnd' "$RENDERER"
          grep -q 'brush.segment(questMouseRayOrigin, questMouseRayEnd)' "$RENDERER"
          grep -q 'EXP13_DEPTH_RAY_CONTINUATION' "$VIEW3D"
          grep -q 'Coords panelPoint = new Coords' "$VIEW3D"
          grep -q 'Coords localRayEnd = panelPoint.sub(v)' "$VIEW3D"
          grep -q 'renderer1.setQuestMouseRayEnd(localRayEnd)' "$VIEW3D"
          grep -q 'EXP12_VISIBLE_RAY' "$SHORTCUT"
          grep -q 'controller.laserEnabled = true' "$SHORTCUT"
          if grep -q 'controller.laserEnabled = false' "$SHORTCUT"; then
            echo 'Native Meta beam must stay visible to A in exp13'
            exit 1
          fi

          # Exp13 Grip: right squeeze enters GeoGebra's native temporary rotate; release restores
          # exactly oldMode. Left squeeze remains the Spatial Grabbable button for panel movement.
          grep -q 'name = "ggqBeginGripRotate"' "$GRIP3D"
          grep -q 'name = "ggqUpdateGripRotate"' "$GRIP3D"
          grep -q 'name = "ggqEndGripRotate"' "$GRIP3D"
          grep -q 'controller.temporaryMode = true' "$GRIP3D"
          grep -q 'controller.oldMode = controller.mode' "$GRIP3D"
          grep -q 'EuclidianConstants.MODE_ROTATEVIEW' "$GRIP3D"
          grep -q 'MoveMode.ROTATE_VIEW' "$GRIP3D"
          grep -q 'ModeSetter.EXIT_TEMPORARY_MODE' "$GRIP3D"
          grep -q 'ButtonBits.ButtonSqueezeR' "$SHORTCUT"
          grep -q 'DepthPointerState.active' "$SHORTCUT"
          grep -q 'controller.isPressed' "$SHORTCUT"
          grep -q 'controller.isReleased' "$SHORTCUT"
          grep -q 'EXP13_GRIP_ROTATE_BRIDGE' "$PANEL"
          grep -q '__ggqSetGripRotate' "$PANEL"
          grep -q 'ggqUpdateGripRotate' "$PANEL"
          grep -q 'fun setGripRotate(active: Boolean)' "$PANEL"
          grep -q 'EXP13_RIGHT_GRIP_ROTATE' "$ACTIVITY"
          grep -q 'onQuestGripRotatePressed' "$ACTIVITY"
          grep -q 'onQuestGripRotateReleased' "$ACTIVITY"
          grep -q 'findSystem<GrabbableSystem>().grabButtons = ButtonBits.ButtonSqueezeL' "$ACTIVITY"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify frozen geometry and exp13 package
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          BACKPLATE=app/src/main/res/layout/spatial_embedded_backplate_panel.xml

          grep -q 'EMBEDDED_STEREO_DEPTH_METERS = 0.0f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_DEPTH_METERS = 0.10f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_SCALE = Vector3(1.07f, 1.07f, 1f)' "$ACTIVITY"
          grep -q 'stereoMode = StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'zIndex = 0' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q '#FFFFFFFF' "$BACKPLATE"
          grep -q 'val leftDestination = Rect(0, 0, halfWidth, canvas.height)' "$SINK"
          grep -q 'val rightDestination = Rect(halfWidth, 0, canvas.width, canvas.height)' "$SINK"
          grep -q 'versionName = "0.9.30-exp13-depth-ray-grip-rotate"' app/build.gradle.kts
          grep -q 'versionCode = 102' app/build.gradle.kts

          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'version=0.9.26'
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'fixed 720px; no dynamic resolution'
          echo "$META" | grep '42ms (~24fps) demand cadence'
          echo "$META" | grep 'selected_geoelements_then_exact_pointer_native_3d_hit'
          echo "$META" | grep 'stereo continuation runs from A-plane to GeoGebra picked-object cursor depth'
          echo "$META" | grep 'right Grip native temporary MODE_ROTATEVIEW'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp13-depth-ray-grip-rotate-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp13-depth-ray-grip-rotate-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp13-depth-ray-grip-rotate-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp13-depth-ray-grip-rotate-debug.apk
          if-no-files-found: error
