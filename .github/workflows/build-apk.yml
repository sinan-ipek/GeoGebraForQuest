name: Build Quest APK

on:
  push:
    branches: [ main, v0.9.22-splash-20fps, v0.9.23-login-back-30fps, v0.9.24-login-back-clear-20fps, v0.9.25-local-file-picker, v0.9.26-palette-context-localfile, v0.9.27-palette-splash-context-fixes, v0.9.28-selected-menu-ray-pass, v0.9.29-a-toggle-palette-offset, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify demand-driven renderer and context-menu hook
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          RENDERER="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/Renderer.java"
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"

          # Exp8 ordinary GeoGebra repaints are RIGHT_EYE-only. LEFT_EYE is produced only
          # after the JS VideoSurface scheduler explicitly requests a new stereo pair.
          grep -q 'requestQuestStereoFrame()' "$RENDERER"
          grep -q 'getQuestStereoFrameSerial()' "$RENDERER"
          grep -q 'private boolean stereoPairRequested = true;' "$QUEST"
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'stereoPairRequested = false;' "$QUEST"
          grep -q 'if (renderStereoPair)' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.clearColorBuffer()' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          if grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"; then
            echo 'Exp8 must not take a renderer-level RIGHT_EYE snapshot'
            exit 1
          fi

          # RIGHT_EYE remains in the main W x H WebGL canvas; JsInterop exports a request
          # function and completed-pair serial for the browser-side scheduler.
          grep -q 'int backingWidth = (int) (w \* ratio);' "$WEB"
          grep -q 'return 0;' "$WEB"
          grep -q 'int sourceX = 0;' "$WEB"
          grep -q 'glContext.finish();' "$WEB"
          grep -q 'ggq-renderer-left-eye' "$WEB"
          grep -q 'questRightEyeCanvas = Js.uncheckedCast(webGLCanvas.getElement());' "$WEB"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'name = "ggqRequestStereoFrame"' "$WEB"
          grep -q 'name = "ggqGetStereoFrameSerial"' "$WEB"
          grep -q 'renderer.requestQuestStereoFrame();' "$WEB"
          grep -q 'renderer.getView().repaintView();' "$WEB"
          if grep -q 'createQuestEyeCanvas("ggq-renderer-right-eye")' "$WEB"; then
            echo 'Exp8 must not allocate a separate RIGHT_EYE hidden canvas'
            exit 1
          fi

          grep -q 'ggqOpenContextMenu' "$EUCLIDIAN"
          grep -q 'ggqCloseContextMenu' "$EUCLIDIAN"
          grep -q 'getAppSelectedGeos()' "$EUCLIDIAN"
          grep -q 'showPopupMenu(' "$EUCLIDIAN"
          grep -q 'selectedGeos, controller.getView(), controller.mouseLoc' "$EUCLIDIAN"
          grep -q 'getGuiManager().removePopup()' "$EUCLIDIAN"
          if grep -q 'controller.handleLongTouch(x, y)' "$EUCLIDIAN"; then
            echo 'A must not perform a new background hit-test'
            exit 1
          fi

          if grep -q 'backingWidth = (int) (w \* ratio) \* 2' "$WEB"; then
            echo 'Renderer must keep a single-eye-width WebGL backing store'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.30-exp8-performance-b
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SYSTEM=app/src/main/java/com/sinan/geogebraforquest/EmbeddedStereoTestSystem.kt
          CONTROLLERS=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PATCH20=tools/patch-geogebra-quest-v0920.py
          PATCH21=tools/patch-geogebra-quest-v0921.py
          JSPATCH=tools/patch-quest-stereo-js-exp8.py
          TEST_LAYOUT=app/src/main/res/layout/spatial_embedded_stereo_test_panel.xml
          BACKPLATE_LAYOUT=app/src/main/res/layout/spatial_embedded_backplate_panel.xml

          # Exp8 performance architecture exists and is wired into every source build.
          test -e "$PATCH20"
          test -e "$PATCH21"
          test -e "$JSPATCH"
          grep -q 'demand-driven stereo-pair patch' "$PATCH21"
          grep -q 'serial-gated demand capture' "$JSPATCH"
          grep -q 'python3 "$ROOT/tools/patch-geogebra-quest-v0921.py" "$SRC"' tools/build-geogebra-quest.sh
          grep -q 'patch-quest-stereo-js-exp8.py' tools/build-geogebra-quest.sh

          # Build-time-patched JS: 20 fps remains only the maximum requested pair cadence.
          # Each completed pair serial is encoded once; manipulation drops capture width to 540,
          # and 720 quality returns after 300 ms idle.
          grep -q 'CAPTURE_INTERVAL_MS = 50' "$JS"
          grep -q 'CAPTURE_ACTIVE_EYE_WIDTH = 540' "$JS"
          grep -q 'CAPTURE_IDLE_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_IDLE_DELAY_MS = 300' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          grep -q 'pendingStereoSerial' "$JS"
          grep -q 'lastDeliveredStereoSerial' "$JS"
          grep -q 'window.ggqRequestStereoFrame' "$JS"
          grep -q 'window.ggqGetStereoFrameSerial' "$JS"
          grep -q 'serial === lastDeliveredStereoSerial' "$JS"
          grep -q 'maxEyeWidth = captureEyeWidth(now)' "$JS"
          grep -q 'renderLatency >= CAPTURE_INTERVAL_MS' "$JS"
          grep -q 'now + 16' "$JS"
          grep -q "document.addEventListener('pointermove', markPointerMotion, true)" "$JS"
          if grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"; then
            echo 'Exp8 must use dynamic 540/720 capture width instead of the old fixed width'
            exit 1
          fi

          # Stable interaction behavior remains present.
          grep -q 'Vector3(-0.13f, 0.01f, 0.10f)' "$ACTIVITY"
          grep -q 'CONTROLLER_PALETTE_SCALE = Vector3(0.30f, 0.30f, 0.30f)' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonTriggerL or ButtonBits.ButtonTriggerR' "$ACTIVITY"
          grep -q 'GeoGebraWebNavigation.toggleContextMenu()' "$ACTIVITY"
          grep -q 'ButtonBits.ButtonA' "$CONTROLLERS"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PANEL"
          grep -q 'fun clearForInactiveView()' "$SINK"

          # Selective-hole anti-recursion guarantees remain unchanged.
          grep -q 'ggqStereoHole' "$JS"
          grep -q 'applySelectiveHole' "$JS"
          grep -q 'Pure read-only lookup' "$JS"
          grep -q "attributeFilter: \['class', 'hidden', 'aria-hidden'\]" "$JS"
          if grep -q "attributeFilter: .*'style'" "$JS"; then
            echo 'Selective-hole code must never observe its own style writes'
            exit 1
          fi
          if grep -A35 'function findVisible3DCanvas' "$JS" | grep -q 'applySelectiveHole'; then
            echo 'High-frequency canvas lookup must stay DOM-read-only'
            exit 1
          fi

          # Exp6 geometry and compositor behavior remain frozen.
          test -e "$SYSTEM"
          test -e "$BACKPLATE_LAYOUT"
          test ! -e "$TEST_LAYOUT"
          grep -q 'EMBEDDED_STEREO_DEPTH_METERS = 0.0f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_DEPTH_METERS = 0.10f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_SCALE = Vector3(1.07f, 1.07f, 1f)' "$ACTIVITY"
          grep -q 'Scale(EMBEDDED_BACKPLATE_SCALE)' "$ACTIVITY"
          grep -q 'Panel(R.id.geogebra_stereo_panel)' "$ACTIVITY"
          grep -q 'panel.setComponent(TransformParent(geoPanel))' "$ACTIVITY"
          grep -q 'widthMeters / STEREO_PANEL_WIDTH_METERS' "$ACTIVITY"
          grep -q 'heightMeters / STEREO_PANEL_HEIGHT_METERS' "$ACTIVITY"
          grep -q 'stereoMode = StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'zIndex = 0' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q '#FFFFFFFF' "$BACKPLATE_LAYOUT"

          # Full-half fill from exp5 remains frozen; black letterbox bands must not return.
          grep -q 'val leftDestination = Rect(0, 0, halfWidth, canvas.height)' "$SINK"
          grep -q 'val rightDestination = Rect(halfWidth, 0, canvas.width, canvas.height)' "$SINK"
          if grep -q 'fitCenter' "$SINK"; then
            echo 'Exp8 must not restore fitCenter letterboxing'
            exit 1
          fi

          # Exp6 one-shot startup splash remains frozen.
          grep -q 'INITIAL_STEREO_POSE = Pose' "$ACTIVITY"
          grep -q 'Vector3(1.10f, 1.30f, 1.15f)' "$ACTIVITY"
          grep -q 'private var startupSplashActive = true' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.resetForAppLaunch()' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.dismissStartupSplash()' "$ACTIVITY"
          grep -q 'fun resetForAppLaunch()' "$SINK"
          grep -q 'fun dismissStartupSplash()' "$SINK"
          grep -q 'private var startupSplashAllowed = true' "$SINK"

          if grep -q 'embeddedTestPanelEntity' "$ACTIVITY"; then
            echo 'Exp8 must not retain the proof-panel entity'
            exit 1
          fi
          if grep -q 'R.id.embedded_stereo_test_panel' "$ACTIVITY"; then
            echo 'Exp8 must not register or instantiate the proof panel'
            exit 1
          fi

          # Android/WebView stays alpha-capable.
          grep -q 'rootView.setBackgroundColor(Color.TRANSPARENT)' "$ACTIVITY"
          grep -q 'webView.setBackgroundColor(Color.TRANSPARENT)' "$ACTIVITY"
          grep -q 'rootView.alpha = 1f' "$ACTIVITY"
          grep -q 'webView.alpha = 1f' "$ACTIVITY"

          grep -q 'versionName = "0.9.30-exp8-performance-b"' app/build.gradle.kts
          grep -q 'versionCode = 97' app/build.gradle.kts

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=single_eye_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.21'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'renderer_normal_frame=RIGHT_EYE only'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'renderer_stereo_pair=requested LEFT_EYE snapshot then RIGHT_EYE main WebGL canvas'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'stereo_request_hooks=ggqRequestStereoFrame,ggqGetStereoFrameSerial'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'bridge=serial-gated JPEG pair delivery; active 540px, idle 720px, quality 0.78'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'no_final_sbs_split=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'quest_context_menu_mode=selected_geoelements'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'spatial_embedded_backplate_panel.xml'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'spatial_embedded_stereo_test_panel.xml'; then
            echo 'Obsolete proof-panel resource must not be packaged'
            exit 1
          fi
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/html/ggtcallback.html'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp8-performance-b-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.30-exp8-performance-b-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp8-performance-b-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp8-performance-b-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp8-performance-b-debug.apk
          if-no-files-found: error
          retention-days: 30
