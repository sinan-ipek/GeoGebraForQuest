name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Apply exp19 through exp30 lifecycle fixes
        shell: bash
        run: |
          python3 tools/patch-quest-stereo-js-exp19.py app/src/main/assets/web/quest-stereo-layout.js
          python3 tools/patch-android-exp19.py .
          python3 tools/patch-android-exp19-volatile.py .
          python3 tools/patch-android-exp19-querycompat.py .
          python3 tools/patch-android-exp20.py .
          python3 tools/patch-android-exp21.py .
          python3 tools/patch-android-exp22.py .
          python3 tools/patch-android-exp22-preserve-navigation.py .
          python3 tools/patch-android-exp23.py .
          python3 tools/patch-android-exp24.py .
          python3 tools/patch-android-exp25.py .
          python3 tools/patch-android-exp26.py .
          python3 tools/patch-android-exp27.py .
          python3 tools/patch-android-exp28.py .
          python3 tools/patch-android-exp29.py .
          python3 tools/patch-android-exp30.py .

      - name: Verify exp30 graceful XR + session continuity and frozen Bug 1
        shell: bash
        run: |
          set -x
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          LOGIN="$SRC/source/web/web/src/main/java/org/geogebra/web/shared/ggtapi/LoginOperationW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          COLD=app/src/main/java/com/sinan/geogebraforquest/ColdLocalFilePickerActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          if grep -q 'adaptiveStereoDelay' "$JS"; then exit 1; fi
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then exit 1; fi

          # Bug 1 remains frozen at Exp25+.
          grep -q 'GGQ_EXP22_LOGIN_READY_ACK' "$LOGIN"
          grep -q 'EXP20_CANONICAL_MAIN_GUARD' "$PANEL"
          grep -q 'EXP22_LOGIN_READY_SUCCESS_HANDSHAKE' "$PANEL"
          grep -q 'EXP25_STRICT_POPUP_WHITELIST' "$PANEL"
          grep -q 'host == "accounts.geogebra.org"' "$PANEL"
          grep -q 'isTrustedGeoGebraCallback(uri)' "$PANEL"
          grep -q 'GeoGebraWebNavigation.deliverOpenFromGgt(uri.toString())' "$PANEL"

          # Exp27-29 file architecture remains intact.
          grep -q 'EXP27_COLD_PROCESS_PICKER' "$PANEL"
          grep -q 'EXP27_OPEN_COLD_PENDING_FILE' "$PANEL"
          grep -q 'addPathHandler("/pending-cold/", ColdLocalFilePathHandler' "$PANEL"
          if grep -q 'requestSpatialFilePickerPanel()' "$PANEL"; then
            echo 'MAIN must not route local files through ActivityPanel'
            exit 1
          fi
          grep -q 'EXP27_COLD_PICKER_PROXY' "$COLD"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$COLD"
          grep -q 'EXP28_KEEP_MAIN_VISIBLE_WHILE_PICKING' "$COLD"
          grep -q 'EXP29_CONFIRMED_PROCESS_EXIT' "$COLD"
          grep -q 'XR_RELEASE_SETTLE_MS = 1200L' "$COLD"
          grep -q 'Process.killProcess(process.pid)' "$COLD"
          grep -q 'android:name=".ColdLocalFilePickerActivity"' "$MANIFEST"
          grep -q 'android:process=":localpicker"' "$MANIFEST"

          # Exp30A: normal handoff is graceful Activity teardown, killProcess only fallback.
          grep -q 'EXP30_GRACEFUL_XR_SHUTDOWN' "$ACTIVITY"
          grep -q 'ACTION_GRACEFUL_COLD_RESTART' "$ACTIVITY"
          grep -q 'BroadcastReceiver' "$ACTIVITY"
          grep -q 'Context.RECEIVER_NOT_EXPORTED' "$ACTIVITY"
          grep -q 'GeoGebraWebNavigation.captureSessionForColdRestart' "$ACTIVITY"
          grep -q 'ColdLocalFileBridge.markXrShutdownReady' "$ACTIVITY"
          grep -q 'EXP30_CROSS_PROCESS_HANDOFF_STATE' "$COLD"
          grep -q 'EXP30_GRACEFUL_FIRST_XR_HANDOFF' "$COLD"
          grep -q 'GRACEFUL_SHUTDOWN_POLL_MS = 50L' "$COLD"
          grep -q 'GRACEFUL_SHUTDOWN_MAX_ATTEMPTS = 50' "$COLD"
          grep -q 'sendBroadcast(' "$COLD"
          grep -q 'waitForGracefulXrShutdown(0)' "$COLD"
          grep -q 'isXrShutdownReady(applicationContext)' "$COLD"

          # Exp30B: SSID is captured and replayed through existing Exp22 handshake.
          grep -q 'EXP30_COLD_SESSION_RESTORE' "$PANEL"
          grep -q 'captureSessionForColdRestart' "$PANEL"
          grep -q 'popupGeoGebraSessionToken(main)' "$PANEL"
          grep -q 'ColdLocalFileBridge.saveSessionToken' "$PANEL"
          grep -q 'ColdLocalFileBridge.readSessionToken' "$PANEL"
          grep -q 'restoreSessionForColdRestartIfAny(context)' "$PANEL"
          grep -q 'deliverLoginToken(token)' "$PANEL"

          python3 - <<'PY'
          from pathlib import Path
          cold = Path('app/src/main/java/com/sinan/geogebraforquest/ColdLocalFilePickerActivity.kt').read_text()
          activity = Path('app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt').read_text()
          panel = Path('app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt').read_text()

          launch = cold.split('    private fun launchPicker() {', 1)[1].split('    private fun killOldMainProcessIfAlive()', 1)[0]
          assert 'killOldMainProcessIfAlive()' not in launch, 'MAIN killed while DocumentsUI is open'

          restart = cold.split('    private fun restartFreshMainAfterPickerResult() {', 1)[1].split('    private fun waitForGracefulXrShutdown', 1)[0]
          assert 'killOldMainProcessIfAlive()' not in restart, 'normal Exp30 path still force-kills MAIN'
          assert 'sendBroadcast(' in restart and 'waitForGracefulXrShutdown(0)' in restart

          graceful = cold.split('    private fun waitForGracefulXrShutdown(attempt: Int) {', 1)[1].split('    // EXP29_CONFIRMED_PROCESS_EXIT', 1)[0]
          assert 'isXrShutdownReady(applicationContext)' in graceful
          assert 'XR_RELEASE_SETTLE_MS' in graceful
          assert 'killOldMainProcessIfAlive()' in graceful, 'Exp29 safety fallback missing'
          assert 'waitForOldMainProcessExit(0)' in graceful, 'Exp29 fallback wait missing'

          destroy = activity.split('    override fun onDestroy() {', 1)[1]
          assert destroy.find('super.onDestroy()') < destroy.find('ColdLocalFileBridge.markXrShutdownReady'), 'XR ACK must be after parent onDestroy'

          open_block = panel.split('    fun openPendingColdLocalFileIfAny() {', 1)[1].split('    fun handleBack()', 1)[0]
          assert 'restoreSessionForColdRestartIfAny(context)' in open_block
          PY

          # Never reintroduce direct controller repair writes.
          if grep -q 'requestControllerPresentationRecovery(' "$ACTIVITY"; then
            echo 'failed Exp22 Avatar recovery must remain inactive'
            exit 1
          fi
          if grep -q 'controller.laserEnabled =' "$SHORTCUT"; then
            echo 'controller path must remain read-only'
            exit 1
          fi
          if grep -q 'entity.setComponent(controller)' "$SHORTCUT"; then
            echo 'must not rewrite Controller components'
            exit 1
          fi

          grep -q 'ButtonBits.ButtonSqueezeR' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonA' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonB' "$SHORTCUT"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify exp30 package
        shell: bash
        run: |
          grep -q 'versionName = "0.9.30-exp30-graceful-session-continuity"' app/build.gradle.kts
          grep -q 'versionCode = 118' app/build.gradle.kts
          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'Open-in-app files load through local GgbAPIW ArchiveLoader'
          echo "$META" | grep 'canonical_runtime=exp20'
          echo "$META" | grep 'login_handshake=exp22'
          echo "$META" | grep 'popup_guard=exp25'
          echo "$META" | grep 'bug1=frozen-exp25'
          echo "$META" | grep 'local_picker=exp27'
          echo "$META" | grep 'local_picker_ux=exp28'
          echo "$META" | grep 'local_picker_handoff=exp29'
          echo "$META" | grep 'local_picker_handoff=exp30'
          echo "$META" | grep 'cold_session_restore=exp30'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp30-graceful-session-continuity-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp30-graceful-session-continuity-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp30-graceful-session-continuity-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp30-graceful-session-continuity-debug.apk
          if-no-files-found: error
