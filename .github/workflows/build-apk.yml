name: Build Quest APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.16 explicit-eye stereo source
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js

          # Keep the headset-proven registered media-panel route unchanged.
          grep -q 'VideoSurfacePanelRegistration' "$ACTIVITY"
          grep -q 'StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'STEREO_PANEL_WIDTH_METERS = 0.80f' "$ACTIVITY"
          grep -q 'STEREO_PANEL_HEIGHT_METERS = 0.45f' "$ACTIVITY"
          grep -q 'STEREO_TEXTURE_WIDTH = 800' "$ACTIVITY"
          grep -q 'STEREO_TEXTURE_HEIGHT = 400' "$ACTIVITY"
          grep -q 'StereoSurfaceProbe.draw' "$ACTIVITY"
          grep -q 'Grabbable()' "$ACTIVITY"
          if grep -Eq 'GrabbableType|IsdkPanelResize|Scale\(' "$ACTIVITY"; then
            echo 'v0.9.16 must preserve the verified simple stereo panel path'
            exit 1
          fi

          # Browser extracts the two WebGL eye viewports independently.
          grep -q 'sourceEyeWidth = Math.floor(source.width / 2)' "$JS"
          grep -q 'rightEyeX = source.width - sourceEyeWidth' "$JS"
          grep -q 'leftCaptureContext.drawImage' "$JS"
          grep -q 'rightCaptureContext.drawImage' "$JS"
          grep -q 'bridgeStereoEyes(leftDataUrl, rightDataUrl)' "$JS"
          grep -q "leftCaptureCanvas.toDataURL" "$JS"
          grep -q "rightCaptureCanvas.toDataURL" "$JS"
          if grep -q "bridge('updateStereoFrame'" "$JS"; then
            echo 'Whole-SBS bridge must not return in v0.9.16'
            exit 1
          fi

          # WebView bridge carries two independent eye images.
          grep -q 'fun updateStereoEyes(leftDataUrl: String, rightDataUrl: String)' "$PANEL"
          grep -q 'LiveStereoFrameSink.submitEyeDataUrls(leftDataUrl, rightDataUrl)' "$PANEL"
          if grep -q 'fun updateStereoFrame' "$PANEL"; then
            echo 'Legacy whole-SBS bridge must not return in v0.9.16'
            exit 1
          fi

          # Native code constructs one and only one final L|R Surface frame.
          grep -q 'fun submitEyeDataUrls' "$SINK"
          grep -q 'val halfWidth = canvas.width / 2' "$SINK"
          grep -q 'val leftDestination = Rect(0, 0, halfWidth, canvas.height)' "$SINK"
          grep -q 'val rightDestination = Rect(halfWidth, 0, canvas.width, canvas.height)' "$SINK"
          grep -q 'canvas.drawBitmap(leftBitmap' "$SINK"
          grep -q 'canvas.drawBitmap(rightBitmap' "$SINK"
          if grep -q 'submitDataUrl' "$SINK"; then
            echo 'Legacy complete-SBS native submission must not return in v0.9.16'
            exit 1
          fi
          if grep -q 'fitCenter' "$SINK"; then
            echo 'fitCenter must not touch the explicit eye-composition path'
            exit 1
          fi

          grep -q 'preserveDrawingBuffer' tools/patch-geogebra-quest-v0913.py

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.16'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=always_2x_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'preserve_drawing_buffer=true'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'extracted independently before JPEG encoding'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'left eye to Surface left half; right eye to Surface right half'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web/GeoGebra/HTML5/5.0/web3d/web3d.nocache.js'; then
            echo 'Unexpected legacy HTML5/5.0 Web3D layout is still packaged'
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.16-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.16-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.16-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.16-debug-apk
          path: dist/GeoGebraForQuest-v0.9.16-debug.apk
          if-no-files-found: error
          retention-days: 30
