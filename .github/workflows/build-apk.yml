name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Apply exp19 exp20 and exp21 local-file rollback
        shell: bash
        run: |
          python3 tools/patch-quest-stereo-js-exp19.py app/src/main/assets/web/quest-stereo-layout.js
          python3 tools/patch-android-exp19.py .
          python3 tools/patch-android-exp19-volatile.py .
          python3 tools/patch-android-exp19-querycompat.py .
          python3 tools/patch-android-exp20.py .
          python3 tools/patch-android-exp21.py .

      - name: Verify exp21 hypothesis and frozen working paths
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SHORTCUT=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Proven stereo renderer remains untouched.
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'CAPTURE_INTERVAL_MS = 42' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          if grep -q 'adaptiveStereoDelay' "$JS"; then exit 1; fi
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then exit 1; fi

          # Keep successful cloud/login/navigation behavior from exp19/20.
          grep -q 'EXP19_NATIVE_LAYOUT_REARM' "$ACTIVITY"
          grep -q 'EXP19_POPUP_SESSION_EDGE' "$PANEL"
          grep -q 'EXP20_CANONICAL_MAIN_GUARD' "$PANEL"
          grep -q 'EXP20_REMOTE_ESCAPE_FALLBACK' "$PANEL"
          grep -q 'EXP15_LOCAL_LOGIN_TOKEN_BRIDGE' "$PANEL"
          grep -q 'EXP17_OPENFROMGGT_HANDOFF' "$PANEL"
          grep -q 'fun deliverOpenFromGgt(url: String)' "$PANEL"
          grep -q "window.ggbApplet.openFile(url" "$PANEL"

          # Exp21: restore the proven v0.9.29 direct local-file continuation.
          grep -q 'EXP21_PROVEN_LOCAL_FILE_PATH' "$PANEL"
          grep -q 'callback.onReceiveValue(result)' "$PANEL"
          grep -q 'GeoGebraLocalFilePicker.handleActivityResult(requestCode, resultCode, data)' "$ACTIVITY"

          # No staged-file restart or controller recovery writes may survive.
          for forbidden in \
            'EXP20_PENDING_LOCAL_FILE' \
            'EXP20_CANONICAL_FILE_RESTART' \
            'activity.recreate()' \
            'PENDING_LOCAL_GGB_URL' \
            'PendingLocalFilePathHandler' \
            'openPendingLocalFileIfAny' \
            'EXP19_SPATIAL_INPUT_RECOVERY' \
            'recoverSpatialInputAfterExternalActivity' \
            'EXP19_INPUT_RECOVERY_WINDOW' \
            'inputRecoveryFrames' \
            'forceInputRecovery' \
            'controller.laserEnabled = true' \
            'entity.setComponent(controller)'; do
            if grep -q "$forbidden" "$PANEL" "$ACTIVITY" "$SHORTCUT"; then
              echo "exp21 forbidden recovery residue: $forbidden"
              exit 1
            fi
          done

          # Grip/A/B remain available while controller state is read-only.
          grep -q 'ButtonBits.ButtonSqueezeR' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonA' "$SHORTCUT"
          grep -q 'ButtonBits.ButtonB' "$SHORTCUT"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify exp21 package
        shell: bash
        run: |
          grep -q 'versionName = "0.9.30-exp21-proven-local-file-path"' app/build.gradle.kts
          grep -q 'versionCode = 109' app/build.gradle.kts
          META=$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt)
          echo "$META" | grep 'renderer_normal_frame=RIGHT_EYE only'
          echo "$META" | grep 'Open-in-app files load through local GgbAPIW ArchiveLoader'
          echo "$META" | grep 'canonical_runtime=exp20'
          echo "$META" | grep 'local_file_path=exp21'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp21-proven-local-file-path-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp21-proven-local-file-path-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp21-proven-local-file-path-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp21-proven-local-file-path-debug.apk
          if-no-files-found: error
