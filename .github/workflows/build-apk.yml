name: Build Quest APK

on:
  push:
    branches: [ main, experimental-embedded-stereo ]
  pull_request:
    branches: [ main, stable-v0.9.29-palette ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify exp10 renderer and right-click source patches
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"
          EUCLIDIAN="$SRC/source/web/web-common/src/main/java/org/geogebra/web/html5/euclidian/EuclidianControllerW.java"
          JS=app/src/main/assets/web/quest-stereo-layout.js
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt

          # Exp8 renderer architecture is retained: ordinary repaints are RIGHT-only;
          # LEFT is produced only for an explicitly requested stereo pair.
          grep -q 'boolean renderStereoPair = stereoPairRequested;' "$QUEST"
          grep -q 'if (renderStereoPair)' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.eye = Renderer.EYE_RIGHT;' "$QUEST"
          grep -q 'stereoFrameSerial++;' "$QUEST"
          if grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"; then
            echo 'RIGHT renderer snapshot must remain removed'
            exit 1
          fi
          grep -q 'questRightEyeCanvas.id = "ggq-renderer-right-eye";' "$WEB"
          grep -q 'name = "ggqRequestStereoFrame"' "$WEB"
          grep -q 'name = "ggqGetStereoFrameSerial"' "$WEB"

          # Exp10 uses exp8 demand scheduling, but dynamic 540/720 resolution is removed.
          grep -q 'CAPTURE_INTERVAL_MS = 50' "$JS"
          grep -q 'CAPTURE_MAX_EYE_WIDTH = 720' "$JS"
          grep -q 'CAPTURE_JPEG_QUALITY = 0.78' "$JS"
          grep -q 'pendingStereoSerial' "$JS"
          grep -q 'lastDeliveredStereoSerial' "$JS"
          grep -q 'now + 16' "$JS"
          grep -q 'toDataURL(' "$JS"
          for forbidden in \
            'CAPTURE_ACTIVE_EYE_WIDTH' \
            'CAPTURE_IDLE_EYE_WIDTH' \
            'CAPTURE_IDLE_DELAY_MS' \
            'lastStereoMotionAt' \
            'markStereoMotion' \
            'markPointerMotion' \
            'captureEyeWidth(' \
            '540'; do
            if grep -q "$forbidden" "$JS"; then
              echo "Dynamic capture residue must not exist in exp10: $forbidden"
              exit 1
            fi
          done
          if grep -q 'EXP9_UI_PRIORITY' "$JS"; then
            echo 'Exp9 UI-priority scheduler must not be active in exp10'
            exit 1
          fi
          if grep -q 'adaptiveStereoDelay' "$JS"; then
            echo 'Exp9 adaptive backoff must not be active in exp10'
            exit 1
          fi
          if grep -q 'canvas.toBlob' "$JS"; then
            echo 'Exp10 intentionally restores the exp8 capture scheduler'
            exit 1
          fi

          # Keep the useful exp9 last-frame retention fix; slow frames must not blank B.
          grep -q 'exp9 retains last live stereo frame' "$SINK"
          if grep -q 'STREAM_IDLE_TIMEOUT_MS' "$SINK"; then
            echo '350ms idle clear must stay removed'
            exit 1
          fi

          # Quest A/right-click: exact pointer coordinates, selected-first behavior, and
          # native 3D hit fallback at the same coordinate.
          grep -q 'v0.9.30 Quest-pointer anchored context menu' "$EUCLIDIAN"
          grep -q 'controller.setMouseLocation(false, questX, questY);' "$EUCLIDIAN"
          grep -q 'getAppSelectedGeos()' "$EUCLIDIAN"
          grep -q 'setHits(controller.mouseLoc, PointerEventType.MOUSE)' "$EUCLIDIAN"
          grep -q 'Hits pointerHits = controller.getView().getHits().getTopHits();' "$EUCLIDIAN"
          grep -q 'setSelectedGeos(pointerSelection)' "$EUCLIDIAN"
          grep -q 'showPopupMenu(' "$EUCLIDIAN"
          grep -q 'return false;' "$EUCLIDIAN"

          # Transparent A-hole remains a valid context-menu coordinate target.
          grep -q 'EXP10_STEREO_HOLE_CONTEXT_TARGET' "$PANEL"
          grep -q "candidate.dataset.ggqStereoHole === 'true'" "$PANEL"
          grep -q 'var nativeAvailable = typeof window.ggqOpenContextMenu' "$PANEL"
          grep -q 'if (!opened && !nativeAvailable)' "$PANEL"
          grep -q 'function isVisibleContextPopup()' "$PANEL"
          if grep -q '__ggqPrioritizeUi(700)' "$PANEL"; then
            echo 'Quest A must not steal render budget for a UI-priority pause'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify frozen panel geometry and exp10 package
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          BACKPLATE=app/src/main/res/layout/spatial_embedded_backplate_panel.xml

          grep -q 'EMBEDDED_STEREO_DEPTH_METERS = 0.0f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_DEPTH_METERS = 0.10f' "$ACTIVITY"
          grep -q 'EMBEDDED_BACKPLATE_SCALE = Vector3(1.07f, 1.07f, 1f)' "$ACTIVITY"
          grep -q 'stereoMode = StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'zIndex = 0' "$ACTIVITY"
          grep -q 'Hittable(MeshCollision.NoCollision)' "$ACTIVITY"
          grep -q '#FFFFFFFF' "$BACKPLATE"
          grep -q 'val leftDestination = Rect(0, 0, halfWidth, canvas.height)' "$SINK"
          grep -q 'val rightDestination = Rect(halfWidth, 0, canvas.width, canvas.height)' "$SINK"
          grep -q 'versionName = "0.9.30-exp10-rightclick"' app/build.gradle.kts
          grep -q 'versionCode = 99' app/build.gradle.kts

          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.23'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'renderer_normal_frame=RIGHT_EYE only'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'fixed 720px; no dynamic resolution'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'no exp9 UI-priority/adaptive backoff'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'selected_geoelements_then_exact_pointer_native_3d_hit'

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.30-exp10-rightclick-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.30-exp10-rightclick-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.30-exp10-rightclick-debug-apk
          path: dist/GeoGebraForQuest-v0.9.30-exp10-rightclick-debug.apk
          if-no-files-found: error
