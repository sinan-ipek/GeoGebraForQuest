name: Build Quest APK

on:
  push:
    branches: [ main, v0.9.22-splash-20fps, v0.9.23-login-back-30fps, v0.9.24-login-back-clear-20fps, v0.9.25-local-file-picker, v0.9.26-palette-context-localfile ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build patched GeoGebra web3d from source
        shell: bash
        run: |
          chmod +x tools/build-geogebra-quest.sh
          ./tools/build-geogebra-quest.sh

      - name: Verify v0.9.19 single-viewport renderer hooks
        shell: bash
        run: |
          SRC=.geogebra-source-work/geogebra
          QUEST="$SRC/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java"
          WEB="$SRC/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java"

          grep -q 'renderer.captureQuestEye(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.clearColorBuffer()' "$QUEST"
          grep -q 'renderer.captureQuestEye(Renderer.EYE_RIGHT)' "$QUEST"
          grep -q 'int backingWidth = (int) (w \* ratio);' "$WEB"
          grep -q 'return 0;' "$WEB"
          grep -q 'int sourceX = 0;' "$WEB"
          grep -q 'glContext.finish();' "$WEB"
          grep -q 'ggq-renderer-left-eye' "$WEB"
          grep -q 'ggq-renderer-right-eye' "$WEB"

          if grep -q 'backingWidth = (int) (w \* ratio) \* 2' "$WEB"; then
            echo 'Renderer must keep a single-eye-width WebGL backing store'
            exit 1
          fi
          if grep -q 'sourceX = eye == EYE_RIGHT ? eyeWidth : 0' "$WEB"; then
            echo 'Right eye must not be read from x=W'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify v0.9.26 requested changes and preserved stereo path
        shell: bash
        run: |
          ACTIVITY=app/src/main/java/com/sinan/geogebraforquest/SpatialGeoGebraActivity.kt
          CONTROLLERS=app/src/main/java/com/sinan/geogebraforquest/QuestControllerShortcutSystem.kt
          PANEL=app/src/main/java/com/sinan/geogebraforquest/GeoGebraWebPanel.kt
          SINK=app/src/main/java/com/sinan/geogebraforquest/LiveStereoFrameSink.kt
          JS=app/src/main/assets/web/quest-stereo-layout.js
          IDS=app/src/main/res/values/ids.xml

          test ! -e app/src/main/java/com/sinan/geogebraforquest/StereoSurfaceProbe.kt
          test ! -e app/src/main/res/layout/scale_controls_panel.xml
          test ! -e app/src/main/res/drawable-nodpi/stereo_test_photo.webp
          test -e app/src/main/res/drawable-nodpi/stereo_splash_left.webp
          test -e app/src/main/res/drawable-nodpi/stereo_splash_right.webp
          test -e "$CONTROLLERS"

          grep -q 'VideoSurfacePanelRegistration' "$ACTIVITY"
          grep -q 'StereoMode.LeftRight' "$ACTIVITY"
          grep -q 'R.id.geogebra_stereo_panel' "$ACTIVITY"
          grep -q 'LiveStereoFrameSink.attachSurface(surface, resources)' "$ACTIVITY"
          grep -q 'Vector3(1.10f, 1.30f, 1.15f)' "$ACTIVITY"
          grep -q 'Quaternion(0f, 15f, 0f)' "$ACTIVITY"
          grep -q 'systemManager.registerSystem(QuestControllerShortcutSystem(this))' "$ACTIVITY"
          grep -q 'onQuestAButtonPressed' "$ACTIVITY"
          grep -q 'GeoGebraWebNavigation.toggleContextMenu()' "$ACTIVITY"
          grep -q 'onQuestBButtonPressed' "$ACTIVITY"
          grep -q 'getAbsoluteTransform(panel)' "$ACTIVITY"
          grep -q 'TransformParent(rightControllerEntity)' "$ACTIVITY"
          grep -q 'Transform(CONTROLLER_PALETTE_POSE)' "$ACTIVITY"
          grep -q 'TransformParent()' "$ACTIVITY"
          grep -q 'Transform(restorePose)' "$ACTIVITY"
          grep -q 'Grabbable(false)' "$ACTIVITY"
          grep -q 'hostActivity = this' "$ACTIVITY"
          grep -q 'override fun onActivityResult' "$ACTIVITY"
          grep -q 'GeoGebraLocalFilePicker.handleActivityResult' "$ACTIVITY"
          grep -q 'name="geogebra_stereo_panel"' "$IDS"

          if grep -q 'KEYCODE_BUTTON_B' "$ACTIVITY" "$PANEL"; then
            echo 'B must not remain mapped to Android/WebView Back in v0.9.26'
            exit 1
          fi

          grep -q 'class QuestControllerShortcutSystem' "$CONTROLLERS"
          grep -q 'SystemBase()' "$CONTROLLERS"
          grep -q 'Controller.id' "$CONTROLLERS"
          grep -q 'ButtonBits.ButtonA' "$CONTROLLERS"
          grep -q 'ButtonBits.ButtonB' "$CONTROLLERS"
          grep -q 'controller.changedButtons' "$CONTROLLERS"
          grep -q 'controller.buttonState' "$CONTROLLERS"

          grep -q 'object GeoGebraLocalFilePicker' "$PANEL"
          grep -q 'activity: Activity?' "$PANEL"
          grep -q 'activity.startActivityForResult' "$PANEL"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$PANEL"
          grep -q 'Intent.CATEGORY_OPENABLE' "$PANEL"
          grep -q 'override fun onShowFileChooser' "$PANEL"
          grep -q 'activity = hostActivity' "$PANEL"
          grep -q 'hostActivity: Activity?' "$PANEL"
          grep -q 'settings.allowContentAccess = true' "$PANEL"
          grep -q 'settings.allowFileAccess = false' "$PANEL"
          grep -q '__ggqToggleContextMenu' "$PANEL"
          grep -q "MouseEvent('contextmenu'" "$PANEL"
          grep -q "key: 'Escape'" "$PANEL"
          grep -q 'KEYCODE_BACK' "$PANEL"

          grep -q "getElementById('ggq-renderer-left-eye')" "$JS"
          grep -q "getElementById('ggq-renderer-right-eye')" "$JS"
          grep -q 'bridgeStereoEyes(leftDataUrl, rightDataUrl)' "$JS"
          grep -q 'CAPTURE_INTERVAL_MS = 50' "$JS"
          grep -q 'findVisible3DCanvas' "$JS"
          grep -q "bridge('stereoInactive', '')" "$JS"
          if grep -Eq 'sourceQuarterWidth|updateStereoQuarters|source.width / 4|source.width / 2' "$JS"; then
            echo 'No final-SBS or quarter splitting may return in v0.9.26'
            exit 1
          fi

          grep -q 'fun clearForInactiveView()' "$SINK"
          grep -q 'decodeResource(resources, R.drawable.stereo_splash_right)' "$SINK"
          grep -q 'decodeResource(resources, R.drawable.stereo_splash_left)' "$SINK"
          grep -q 'PorterDuff.Mode.CLEAR' "$SINK"
          grep -q 'STREAM_IDLE_TIMEOUT_MS = 350L' "$SINK"
          grep -q 'val halfWidth = canvas.width / 2' "$SINK"
          grep -q 'canvas.drawBitmap(' "$SINK"

          grep -q 'versionName = "0.9.26"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts

      - name: Verify source-built GeoGebra runtime layout
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/deployggb.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/web3d.nocache.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/css/bundles/bundle.css'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'version=0.9.19'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'backing_store=single_eye_width'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'both render at x=0'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'gpu_sync=gl.finish before each eye canvas copy'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt | grep 'no_final_sbs_split=true'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'stereo_splash_left.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'stereo_splash_right.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/web/GeoGebra/web3d/html/ggtcallback.html'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'stereo_test_photo'; then
            echo 'TEST photo unexpectedly packaged in v0.9.26'
            exit 1
          fi
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web/GeoGebra/HTML5/5.0/web3d/web3d.nocache.js'; then
            echo 'Unexpected legacy HTML5/5.0 Web3D layout is still packaged'
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GeoGebraForQuest-v0.9.26-debug.apk
          ls -lh dist/GeoGebraForQuest-v0.9.26-debug.apk
          sha256sum dist/GeoGebraForQuest-v0.9.26-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-v0.9.26-debug-apk
          path: dist/GeoGebraForQuest-v0.9.26-debug.apk
          if-no-files-found: error
          retention-days: 30
