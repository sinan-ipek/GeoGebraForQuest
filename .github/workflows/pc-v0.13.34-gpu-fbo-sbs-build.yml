name: GeoGebraForQuest PC v0.13.34 GPU FBO SBS

on:
  push:
    branches:
      - pc-v0.13.34-gpu-fbo-sbs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-geogebra-web:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Inject v0.13.34 GPU FBO source patch before GeoGebra compile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/build-geogebra-quest.sh')
          s = p.read_text(encoding='utf-8')
          anchor = 'echo "[GGQ] retaining last stereo frame and real popup-state detection"\n'
          if anchor not in s:
              raise SystemExit('GeoGebra source-build injection anchor missing')
          insert = (
              'echo "[GGQ] applying PC v0.13.34 GPU FBO stereo renderer"\n'
              'python3 "$ROOT/tools/patch-geogebra-pc-v01334.py" "$SRC"\n\n'
          )
          p.write_text(s.replace(anchor, insert + anchor, 1), encoding='utf-8')
          PY
          chmod +x tools/build-geogebra-quest.sh

      - name: Build patched GeoGebra Web3D
        shell: bash
        run: ./tools/build-geogebra-quest.sh

      - name: Verify v0.13.34 source renderer
        shell: bash
        run: |
          set -euo pipefail
          WEB=.geogebra-source-work/geogebra/source/web/web/src/main/java/org/geogebra/web/geogebra3D/web/euclidian3D/openGL/RendererWithImplW.java
          QUEST=.geogebra-source-work/geogebra/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/QuestStereoRenderer.java
          BASE=.geogebra-source-work/geogebra/source/shared/common/src/main/java/org/geogebra/common/geogebra3D/euclidian3D/openGL/Renderer.java

          grep -q 'GGQ_PC_V01334_GPU_FBO_SBS' "$WEB"
          grep -q 'int backingWidth = (int) (w \* ratio) \* 2;' "$WEB"
          grep -q 'v0.9.19: LEFT_EYE and RIGHT_EYE both render at x=0' "$WEB"
          grep -q 'ggqGpuBindEyeFramebuffer' "$WEB"
          grep -q 'ggqGpuComposeStereoFbo' "$WEB"
          grep -q 'beginQuestEyeRender' "$BASE"
          grep -q 'composeQuestStereoFrame' "$BASE"
          grep -q 'GGQ_PC_V01334_GPU_FBO_SBS' "$QUEST"
          grep -q 'renderer.beginQuestEyeRender(Renderer.EYE_LEFT)' "$QUEST"
          grep -q 'renderer.beginQuestEyeRender(Renderer.EYE_RIGHT)' "$QUEST"
          grep -q 'renderer.composeQuestStereoFrame()' "$QUEST"
          grep -q 'stereoFrameSerial++' "$QUEST"

          test -f app/src/main/assets/web/GeoGebra/deployggb.js
          test -f app/src/main/assets/web/GeoGebra/web3d/web3d.nocache.js
          cat >> app/src/main/assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt <<'EOF'
          pc_gpu_renderer=v0.13.34 direct W x H eye FBO render + one-draw SBS publish
          pc_gpu_eye_geometry=both eyes use proven x=0 W x H viewport/frustum
          pc_gpu_eye_storage=dedicated WebGL colour texture + depth renderbuffer FBO per eye
          pc_gpu_pair_publish=single fullscreen WebGL draw to 2W main backing after both eye FBOs complete
          pc_gpu_transport=CEF accelerated D3D11 texture; no framebuffer readback/copyTexSubImage2D/getImageData
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: v01334-geogebra-gpu-fbo-sbs
          path: app/src/main/assets/web/GeoGebra/**
          if-no-files-found: error
          compression-level: 6

  build-windows:
    needs: build-geogebra-web
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Exp46 web shell
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" --repo "sinan-ipek/GeoGebraForQuest" --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" --dir ".exp46"
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw 'Exp46 APK missing' }
          Copy-Item $apk.FullName ".exp46/exp46.zip" -Force
          Expand-Archive ".exp46/exp46.zip" ".exp46/unpacked" -Force
          $source = ".exp46/unpacked/assets/web"
          if (Test-Path "app/src/main/assets/web") { Remove-Item "app/src/main/assets/web" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force

      - uses: actions/download-artifact@v4
        with:
          name: v01334-geogebra-gpu-fbo-sbs
          path: .gpu-geogebra

      - name: Overlay v0.13.34 custom GeoGebra runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'app/src/main/assets/web/GeoGebra'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item '.gpu-geogebra/*' $dest -Recurse -Force
          if (-not (Test-Path "$dest/deployggb.js")) { throw 'custom deployggb.js missing' }
          if (-not (Test-Path "$dest/web3d/web3d.nocache.js")) { throw 'custom web3d runtime missing' }
          $meta = Get-Content "$dest/GGQ_SOURCE_BUILD.txt" -Raw
          if (-not $meta.Contains('pc_gpu_renderer=v0.13.34')) { throw 'v0.13.34 source metadata missing' }

      - name: Prepare standalone Quest stereo splash artwork
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $left = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_left.webp'
          $right = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/v0.9.22-splash-20fps/app/src/main/res/drawable-nodpi/stereo_splash_right.webp'
          Invoke-WebRequest $left -OutFile 'pc-xr/stereo_splash_left.webp'
          Invoke-WebRequest $right -OutFile 'pc-xr/stereo_splash_right.webp'
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from PIL import Image
          for side in ('left','right'):
              src=f'pc-xr/stereo_splash_{side}.webp'
              dst=f'pc-xr/stereo_splash_{side}.png'
              with Image.open(src) as im:
                  im.convert('RGBA').save(dst, 'PNG')
          '@ | python -

      - name: Apply known-working v0.13.22 stack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v013.py
          python tools/patch-pc-v013-buildfix.py
          python tools/patch-pc-v0131.py
          python tools/patch-pc-v0132.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0133.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0134.py
          python tools/patch-pc-v0134-buildfix.py
          python tools/patch-pc-v0135.py
          python tools/patch-pc-v0135-buildfix.py
          python tools/patch-pc-v0136.py
          python tools/patch-pc-v0136-buildfix.py
          python tools/patch-pc-v0137.py
          python tools/patch-pc-v0137-buildfix.py
          python tools/patch-pc-v0138-prep.py
          python tools/patch-pc-v0138-prep2.py
          python tools/patch-pc-v0138.py
          python tools/patch-pc-v0138-buildfix.py
          python tools/patch-pc-v0139-direct.py
          python tools/patch-pc-v0139-buildfix.py
          python tools/patch-pc-v01310.py
          python tools/patch-pc-v01310-buildfix.py
          python tools/patch-pc-v01311.py
          python tools/patch-pc-v01311-extra.py
          python tools/patch-pc-v01311-postfix.py
          python tools/patch-pc-v01312-prep.py
          python tools/patch-pc-v01312-buildprep.py
          python tools/patch-pc-v01312.py
          python tools/patch-pc-v01313.py
          python tools/patch-pc-v01314.py
          python tools/patch-pc-v01315.py
          python tools/patch-pc-v01316.py
          python tools/patch-pc-v01317.py
          python tools/patch-pc-v01318-prep.py
          python tools/patch-pc-v01318.py
          python tools/patch-pc-v01318-buildfix.py
          python tools/patch-pc-v01319.py
          python tools/patch-pc-v01320.py
          python tools/patch-pc-v01321.py
          python tools/patch-pc-v01321-js-extra.py
          python tools/patch-pc-v01321-extra.py
          python tools/patch-pc-v01321-compilefix.py
          python tools/patch-pc-v01321-buildfix.py
          python tools/patch-pc-v01322.py
          python tools/patch-pc-v01322-compilefix.py

      - name: Import proven v0.13.24 raw layer as compatibility baseline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/6ec8b49d1a23f2eca3a2a3feba220a59589aa545/tools'
          Invoke-WebRequest "$base/patch-pc-v01324.py" -OutFile 'tools/patch-pc-v01324-imported.py'
          Invoke-WebRequest "$base/patch-pc-v01324-buildfix.py" -OutFile 'tools/patch-pc-v01324-buildfix-imported.py'
          python tools/patch-pc-v01324-imported.py
          python tools/patch-pc-v01324-buildfix-imported.py

      - name: Apply depth-proven single-panel architecture through v0.13.31
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01327.py
          python tools/patch-pc-v01327-buildfix.py
          python tools/patch-pc-v01327-xr-compilefix.py
          python tools/patch-pc-v01328.py
          Invoke-WebRequest 'https://raw.githubusercontent.com/sinan-ipek/GeoGebraForQuest/checkpoint-v0.13.22-working-stereo/pc/pc-stereo-layout.js' -OutFile 'pc/pc-stereo-layout.js'
          python tools/patch-pc-v01329.py
          python tools/patch-pc-v01331.py

      - name: Apply v0.13.34 FBO embedded-SBS host and robust A-share
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-pc-v01334.py

      - name: Verify v0.13.34 architecture
        shell: powershell
        run: |
          $index = Get-Content 'app/src/main/assets/web/index.html' -Raw
          $runtime = Get-Content 'pc/pc-stereo-layout.js' -Raw
          $graphics = Get-Content 'pc/MainFormV11.Graphics.cs' -Raw
          $writer = Get-Content 'pc/StereoSharedFrameWriter.cs' -Raw
          $render = Get-Content 'pc-xr/v11-render.hpp' -Raw
          $project = Get-Content 'pc/GeoGebraForQuest.PC.csproj' -Raw
          $build = Get-Content 'pc/build.ps1' -Raw
          $meta = Get-Content 'app/src/main/assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt' -Raw

          if (-not $meta.Contains('pc_gpu_renderer=v0.13.34')) { throw 'v0.13.34 FBO source missing' }
          if (-not $meta.Contains('both eyes use proven x=0 W x H')) { throw 'single-viewport source invariant missing' }
          if (-not $index.Contains('ggq-gpu-fbo-sbs')) { throw 'GPU FBO packer missing' }
          if (-not $index.Contains('framebufferTexture2D')) { throw 'eye FBO color target missing' }
          if (-not $index.Contains('renderbufferStorage')) { throw 'eye FBO depth target missing' }
          if (-not $index.Contains('ggqGpuComposeStereoFbo')) { throw 'FBO stereo compositor missing' }
          if (-not $runtime.Contains('NO captureLoop')) { throw 'CPU capture loop still active' }
          if (-not $graphics.Contains('TryQueueGpuPublishLocked(target, _pcSrvs[next])')) { throw 'client-owned A-share source missing' }
          if (-not $graphics.Contains('PSShare')) { throw 'A-share conversion shader missing' }
          if (-not $graphics.Contains('BindFlags.ShaderResource | BindFlags.RenderTarget')) { throw 'share render target missing' }
          if (-not $graphics.Contains('context.OutputMerger.SetRenderTargets(_xrSharedRtv)')) { throw 'share shader blit missing' }
          if (-not $graphics.Contains('cbuffer StereoParams')) { throw 'PC SBS decode shader missing' }
          if (-not $writer.Contains('_view.Write(116, 4)')) { throw 'geometry-only marker missing' }
          if (-not $render.Contains('GPU-NATIVE EMBEDDED-SBS')) { throw 'XR embedded SBS compositor missing' }
          if (-not $project.Contains('<Version>0.13.34</Version>')) { throw 'v0.13.34 project version missing' }
          if (-not $build.Contains('v0.13.34-gpu-fbo-sbs')) { throw 'v0.13.34 package label missing' }

      - name: Build Windows EXE package
        shell: powershell
        run: .\pc\build.ps1

      - name: Verify package
        shell: powershell
        run: |
          $dir = 'dist/GeoGebraForQuest-PC-v0.13.34-gpu-fbo-sbs-win-x64'
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) { throw 'Main EXE missing' }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) { throw 'XR EXE missing' }
          if (-not (Test-Path "$dir/assets/web/GeoGebra/GGQ_SOURCE_BUILD.txt")) { throw 'custom source metadata missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.13.34-gpu-fbo-sbs-win-x64
          path: dist/GeoGebraForQuest-PC-v0.13.34-gpu-fbo-sbs-win-x64/**
          if-no-files-found: error
          compression-level: 6
