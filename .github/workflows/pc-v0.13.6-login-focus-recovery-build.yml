name: GeoGebraForQuest PC v0.13.6 Login Focus Recovery

on:
  push:
    branches:
      - pc-v0.13.6-login-focus-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Download Exp46 assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" --repo "sinan-ipek/GeoGebraForQuest" --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" --dir ".exp46"
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          Copy-Item $apk.FullName ".exp46/exp46.zip" -Force
          Expand-Archive ".exp46/exp46.zip" ".exp46/unpacked" -Force
          $source = ".exp46/unpacked/assets/web"
          if (Test-Path "app/src/main/assets/web") { Remove-Item "app/src/main/assets/web" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force
      - name: Apply patches
        shell: powershell
        run: |
          python tools/patch-pc-v013.py
          python tools/patch-pc-v013-buildfix.py
          python tools/patch-pc-v0131.py
          python tools/patch-pc-v0132.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0133.py
          python tools/patch-pc-v0133-adapter.py
          python tools/patch-pc-v0134.py
          python tools/patch-pc-v0134-buildfix.py
          python tools/patch-pc-v0135.py
          python tools/patch-pc-v0135-buildfix.py
          python tools/patch-pc-v0136.py
          python tools/patch-pc-v0136-buildfix.py
      - name: Verify v0.13.6 changes
        shell: powershell
        run: |
          $main = Get-Content "pc/MainFormV11.cs" -Raw
          $life = Get-Content "pc/SameSurfaceLifeSpanHandler.cs" -Raw
          $browser = Get-Content "pc/D3DChromiumWebBrowser.cs" -Raw
          $project = Get-Content "pc/GeoGebraForQuest.PC.csproj" -Raw
          if ($main -notmatch "caret-color" -or $main -notmatch "ggq-focus-marker" -or $main -notmatch "SONRAKİ") { throw "login focus feedback missing" }
          if ($main -notmatch "RecoverMainBrowserAfterAuthClose" -or $main -notmatch "_requestContext is null") { throw "auth recovery path missing" }
          if ($life -notmatch "OnBeforeClose" -or $life -notmatch "_recoverMainBrowser") { throw "lifespan recovery callback missing" }
          if ($browser -notmatch "recoverMainBrowser") { throw "browser recovery callback wiring missing" }
          if ($main -notmatch "0\.13\.6-login-focus-recovery") { throw "v0.13.6 runtime tag missing" }
          if ($project -notmatch "<Version>0.13.6</Version>") { throw "v0.13.6 version missing" }
      - name: Build Windows EXE package
        shell: powershell
        run: .\pc\build.ps1
      - name: Verify package
        shell: powershell
        run: |
          $dir = "dist/GeoGebraForQuest-PC-v0.13.6-login-focus-recovery-win-x64"
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) { throw "Main EXE missing" }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) { throw "XR EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.13.6-login-focus-recovery-win-x64
          path: dist/GeoGebraForQuest-PC-v0.13.6-login-focus-recovery-win-x64/**
          if-no-files-found: error
          compression-level: 6
