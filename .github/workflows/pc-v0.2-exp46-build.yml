name: GeoGebraForQuest PC v0.11.1 CEF GPU Direct

on:
  push:
    branches:
      - pc-v0.11-cef-gpu-direct
    paths:
      - "pc/**"
      - "pc-xr/**"
      - ".github/workflows/pc-v0.2-exp46-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact published Quest Exp46 APK
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" `
            --repo "sinan-ipek/GeoGebraForQuest" `
            --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" `
            --dir ".exp46"

          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw "Published Exp46 APK could not be downloaded." }

      - name: Extract exact Exp46 web assets from APK
        shell: powershell
        run: |
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          $zip = ".exp46/exp46.zip"
          $extract = ".exp46/unpacked"
          Copy-Item $apk.FullName $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $source = Join-Path $extract "assets/web"
          if (-not (Test-Path "$source/GeoGebra/web3d/web3d.nocache.js")) {
            throw "Published Exp46 APK does not contain expected Web3D assets."
          }
          if (-not (Test-Path "$source/GeoGebra/GGQ_SOURCE_BUILD.txt")) {
            throw "Published Exp46 APK source metadata missing."
          }

          if (Test-Path "app/src/main/assets/web") {
            Remove-Item "app/src/main/assets/web" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force

      - name: Verify GPU-direct architecture
        shell: powershell
        run: |
          $main = Get-Content "pc-xr/main-v11.cpp" -Raw
          $shared = Get-Content "pc-xr/v11-shared.hpp" -Raw
          $graphics = Get-Content "pc/MainFormV11.Graphics.cs" -Raw
          $cef = Get-Content "pc/D3DChromiumWebBrowser.cs" -Raw
          $build = Get-Content "pc/build.ps1" -Raw
          $all = $main + "`n" + $shared + "`n" + $graphics + "`n" + $cef

          if ($all -match "BitBlt\s*\(" -or
              $all -match "PrintWindow\s*\(" -or
              $all -match "Windows\.Graphics\.Capture") {
            throw "Screen-capture code found in v0.11.1 GPU-direct path"
          }
          if ($cef -notmatch "SharedTextureEnabled = true") {
            throw "CEF shared-texture mode missing"
          }
          if ($cef -match "ExternalBeginFrameEnabled = true") {
            throw "Old external CEF frame scheduling still enabled"
          }
          if ($cef -notmatch "windowInfo.Width" -or $cef -notmatch "windowInfo.Height") {
            throw "CEF initial dimensions missing"
          }
          if ($graphics -notmatch "OnAcceleratedPaint") {
            throw "CEF accelerated-paint callback missing"
          }
          if ($graphics -match "SendExternalBeginFrame") {
            throw "Manual CEF external begin-frame call still exists"
          }
          if ($graphics -notmatch 'new InputElement\("POSITION"') {
            throw "Standard PC POSITION shader input missing"
          }
          if ($graphics -notmatch "CullMode = CullMode.None") {
            throw "PC rasterizer culling fix missing"
          }
          if ($graphics -notmatch "CopyResource\(cefTexture, _xrSharedTexture\)") {
            throw "CEF-to-owned D3D11 texture path missing"
          }
          if ($shared -notmatch "OpenSharedResource") {
            throw "XR shared D3D11 consumer missing"
          }
          if ($main -notmatch "XrCompositionLayerProjection") {
            throw "OpenXR stereo projection missing"
          }
          if ($main -notmatch "/interaction_profiles/oculus/touch_controller") {
            throw "Meta Touch interaction profile missing"
          }
          if ($main -notmatch "/user/hand/right/input/aim/pose" -or
              $main -notmatch "/user/hand/right/input/trigger/value") {
            throw "Right Touch aim/trigger bindings missing"
          }
          if ($build -match "Compress-Archive") {
            throw "Nested ZIP regression: build.ps1 must not create an inner ZIP"
          }

      - name: Build Windows app and OpenXR companion
        shell: powershell
        run: .\pc\build.ps1

      - name: Verify package
        shell: powershell
        run: |
          $dir = "dist/GeoGebraForQuest-PC-v0.11.1-cef-gpu-direct-win-x64"
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) {
            throw "Main EXE missing"
          }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) {
            throw "XR EXE missing"
          }
          if (-not (Test-Path "$dir/assets/web/GeoGebra/web3d/web3d.nocache.js")) {
            throw "Web3D missing"
          }
          if (-not (Test-Path "$dir/libcef.dll")) {
            throw "CEF libcef.dll missing"
          }
          $subprocess = Get-ChildItem $dir -Filter "CefSharp.BrowserSubprocess*.exe" -Recurse | Select-Object -First 1
          if (-not $subprocess) {
            throw "CEF browser subprocess missing"
          }
          $innerZip = Get-ChildItem $dir -Filter "*.zip" -Recurse | Select-Object -First 1
          if ($innerZip) {
            throw "Nested ZIP regression: package directory contains a ZIP"
          }

      - name: Upload single-layer Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.11.1-cef-gpu-direct-win-x64
          path: dist/GeoGebraForQuest-PC-v0.11.1-cef-gpu-direct-win-x64/**
          if-no-files-found: error
          compression-level: 6
