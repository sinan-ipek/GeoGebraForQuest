name: GeoGebraForQuest PC v0.13 GPU Stereo

on:
  push:
    branches:
      - pc-v0.13-gpu-stereo
    paths:
      - "pc/**"
      - "pc-xr/**"
      - ".github/workflows/pc-v0.2-exp46-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact published Quest Exp46 APK
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".exp46" | Out-Null
          gh release download "v0.9.30-exp46-hover-target-grip-focus" `
            --repo "sinan-ipek/GeoGebraForQuest" `
            --pattern "GeoGebraForQuest-v0.9.30-exp46-hover-target-grip-focus-debug.apk" `
            --dir ".exp46"

          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw "Published Exp46 APK could not be downloaded." }

      - name: Extract exact Exp46 web assets from APK
        shell: powershell
        run: |
          $apk = Get-ChildItem ".exp46" -Filter "*.apk" | Select-Object -First 1
          $zip = ".exp46/exp46.zip"
          $extract = ".exp46/unpacked"
          Copy-Item $apk.FullName $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $source = Join-Path $extract "assets/web"
          if (-not (Test-Path "$source/GeoGebra/web3d/web3d.nocache.js")) {
            throw "Published Exp46 APK does not contain expected Web3D assets."
          }
          if (-not (Test-Path "$source/GeoGebra/GGQ_SOURCE_BUILD.txt")) {
            throw "Published Exp46 APK source metadata missing."
          }

          if (Test-Path "app/src/main/assets/web") {
            Remove-Item "app/src/main/assets/web" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "app/src/main/assets" | Out-Null
          Copy-Item $source "app/src/main/assets/web" -Recurse -Force

      - name: Verify v0.13 GPU-only stereo architecture
        shell: powershell
        run: |
          $graphics = Get-Content "pc/MainFormV11.Graphics.cs" -Raw
          $runtime = Get-Content "pc/pc-stereo-layout.js" -Raw
          $input = Get-Content "pc/MainFormV11.InputStereo.cs" -Raw
          $publisher = Get-Content "pc/GpuStereoTexturePublisher.cs" -Raw
          $xr = Get-Content "pc-xr/main-v13.cpp" -Raw
          $xrStereo = Get-Content "pc-xr/v13-gpu-stereo.hpp" -Raw
          $all = $graphics + "`n" + $runtime + "`n" + $input + "`n" + $publisher + "`n" + $xr + "`n" + $xrStereo

          if ($all -match "BitBlt\s*\(" -or
              $all -match "PrintWindow\s*\(" -or
              $all -match "Windows\.Graphics\.Capture") {
            throw "Screen-capture code found in v0.13"
          }
          if ($runtime -match "toDataURL|toBlob|image/jpeg|FileReader") {
            throw "JPEG/base64 stereo transport still exists"
          }
          if ($input -match "DecodeDataUrl|QueueStereoFrames") {
            throw "CPU stereo decode path still exists"
          }
          if ($runtime -notmatch "stereoGpuPhase" -or
              $runtime -notmatch "ggq-pc-gpu-left-eye-overlay") {
            throw "GPU stereo compositor phase path missing"
          }
          if ($graphics -notmatch "CaptureStereoGpuPhaseLocked" -or
              $graphics -notmatch "CopySubresourceRegion") {
            throw "GPU stereo crop path missing"
          }
          if ($graphics -match "WaitForGpuLocked") {
            throw "Blocking GPU query path still exists"
          }
          if ($graphics -match 'Present\(1,') {
            throw "Blocking VSync Present(1) path still exists"
          }
          if ($graphics -notmatch "_presentEvent\.WaitOne") {
            throw "Event-driven PC present path missing"
          }
          if ($xrStereo -notmatch "SharedGpuTextureCache") {
            throw "XR shared GPU cache missing"
          }
          if ($xr -notmatch "kProjectionResolutionScale = 1\.30f") {
            throw "HQ projection scale missing"
          }
          if ($xr -notmatch "StereoGpuFrameInfoReader") {
            throw "GPU B metadata reader missing"
          }

      - name: Build Windows app and OpenXR companion
        shell: powershell
        run: .\pc\build.ps1

      - name: Verify package
        shell: powershell
        run: |
          $dir = "dist/GeoGebraForQuest-PC-v0.13.0-gpu-stereo-win-x64"
          if (-not (Test-Path "$dir/GeoGebraForQuestPC.exe")) {
            throw "Main EXE missing"
          }
          if (-not (Test-Path "$dir/xr/GeoGebraForQuestPC.XR.exe")) {
            throw "XR EXE missing"
          }
          if (-not (Test-Path "$dir/assets/web/GeoGebra/web3d/web3d.nocache.js")) {
            throw "Web3D missing"
          }
          if (-not (Test-Path "$dir/libcef.dll")) {
            throw "CEF libcef.dll missing"
          }
          $subprocess = Get-ChildItem $dir -Filter "CefSharp.BrowserSubprocess*.exe" -Recurse | Select-Object -First 1
          if (-not $subprocess) {
            throw "CEF browser subprocess missing"
          }
          $innerZip = Get-ChildItem $dir -Filter "*.zip" -Recurse | Select-Object -First 1
          if ($innerZip) {
            throw "Nested ZIP regression: package directory contains a ZIP"
          }

      - name: Upload single-layer Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GeoGebraForQuest-PC-v0.13.0-gpu-stereo-win-x64
          path: dist/GeoGebraForQuest-PC-v0.13.0-gpu-stereo-win-x64/**
          if-no-files-found: error
          compression-level: 6
